<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FOSNALIC High-Speed Compressor</title>
<script src="https://cdn.jsdelivr.net/npm/@ffmpeg/ffmpeg@0.12.15/dist/umd/ffmpeg.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@ffmpeg/util@0.12.1/dist/umd/util.js"></script>
<style>
:root{--bg:#121212;--card:#1e1e1e;--text:#e0e0e0;--accent:#0088cc;--success:#4caf50;--error:#f44336;--border:#333}
body{font-family:system-ui,sans-serif;background:var(--bg);color:var(--text);margin:0;padding:20px;display:flex;justify-content:center}
.container{width:100%;max-width:500px;display:flex;flex-direction:column;gap:15px}
h1{text-align:center;font-size:1.5rem}
.card{background:var(--card);border-radius:12px;padding:20px;border:1px solid var(--border)}
label{display:block;margin-bottom:8px;font-weight:bold;font-size:.9rem}
input,select{width:100%;padding:12px;background:#2c2c2c;border:1px solid var(--border);border-radius:6px;color:#fff;font-size:1rem;box-sizing:border-box}
button{width:100%;padding:12px;background:var(--accent);color:#fff;border:none;border-radius:6px;font-size:1rem;cursor:pointer;font-weight:bold}
button:hover{background:#006699}
button:disabled{background:#555}
.status-bar{height:6px;background:#333;border-radius:3px;overflow:hidden;margin-top:10px;display:none}
.progress-fill{height:100%;background:var(--success);width:0%}
.log-entry{font-size:.85rem;padding:5px 0;border-bottom:1px solid #333;word-break:break-word}
.log-entry.error{color:var(--error)}.log-entry.success{color:var(--success)}.log-entry.info{color:#aaa}
.hidden{display:none!important}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.85);display:flex;justify-content:center;align-items:center;z-index:1000}
.modal-content{background:var(--card);padding:30px;border-radius:12px;width:90%;max-width:400px;text-align:center}
.link-btn{background:none!important;color:#0088cc!important;padding:5px!important;font-size:.85rem!important;text-decoration:underline}
</style>
</head>
<body>
<div class="container">
<h1>⚡ FOSNALIC Compressor</h1>
<div class="card">
<label>Status</label>
<div id="connectionStatus" style="color:#aaa">Initializing...</div>
<div class="status-bar" id="progressBarContainer"><div class="progress-fill" id="progressBar"></div></div>
<div id="progressText" style="font-size:.8rem;margin-top:5px;text-align:center"></div>
<button id="changeTokenBtn" class="link-btn">Change / Clear Token</button>
</div>
<div class="card">
<label>Compression Level</label>
<select id="qualitySelect">
<option value="23">Balanced (Recommended)</option>
<option value="28">Aggressive (Smaller Size)</option>
<option value="18">Lossless (Larger Size)</option>
</select>
</div>
<div class="card">
<label>Activity Log</label>
<div id="logs" style="max-height:200px;overflow-y:auto"></div>
</div>
</div>

<div id="authModal" class="modal-overlay hidden">
<div class="modal-content">
<h2>Welcome</h2>
<p>Enter your Telegram Bot Token to start.</p>
<input type="text" id="tokenInput" placeholder="123456:ABC-DEF..." autocomplete="off">
<button id="startBtn" style="margin-top:15px">Start Compressor</button>
<p id="authError" style="color:#f44336;font-size:.85rem"></p>
</div>
</div>

<script>
const { FFmpeg } = window.FFmpeg;
const { fetchFile, toBlobURL } = window.FFmpegUtil;

let ffmpeg = null;
let botToken = localStorage.getItem('fosnalic_token') || '';
let lastUpdateId = 0;
let isProcessing = false;
let currentQuality = parseInt(localStorage.getItem('fosnalic_quality')) || 23;
let polling = false;

const els = {
  modal: document.getElementById('authModal'),
  tokenInput: document.getElementById('tokenInput'),
  startBtn: document.getElementById('startBtn'),
  authError: document.getElementById('authError'),
  status: document.getElementById('connectionStatus'),
  progressBarContainer: document.getElementById('progressBarContainer'),
  progressBar: document.getElementById('progressBar'),
  progressText: document.getElementById('progressText'),
  logs: document.getElementById('logs'),
  quality: document.getElementById('qualitySelect'),
  changeTokenBtn: document.getElementById('changeTokenBtn')
};

function log(msg, type='info'){
  const div=document.createElement('div');
  div.className=`log-entry ${type}`;
  div.textContent=`[${new Date().toLocaleTimeString()}] ${msg}`;
  els.logs.prepend(div);
}
function setProgress(pct,text){
  els.progressBarContainer.style.display='block';
  els.progressBar.style.width=`${pct}%`;
  els.progressText.textContent=text||'';
}
function showModal(msg=''){
  els.authError.textContent=msg;
  els.modal.classList.remove('hidden');
}
function hideModal(){ els.modal.classList.add('hidden'); }

function init(){
  els.quality.value = currentQuality;
  els.quality.addEventListener('change', e=>{
    currentQuality=parseInt(e.target.value);
    localStorage.setItem('fosnalic_quality', currentQuality);
    log(`Quality changed to CRF ${currentQuality}`);
  });
  els.startBtn.addEventListener('click', handleAuth);
  els.tokenInput.addEventListener('keydown', e=>{ if(e.key==='Enter') handleAuth(); });
  els.changeTokenBtn.addEventListener('click', ()=>{
    localStorage.removeItem('fosnalic_token');
    botToken=''; polling=false;
    els.tokenInput.value='';
    showModal('Token cleared. Enter a new one.');
  });
  if(botToken){ startBot(); } else { showModal(); }
}

async function handleAuth(){
  const token=els.tokenInput.value.trim();
  if(!token || !token.includes(':')){ els.authError.textContent='Invalid token. Format: 123456:ABC...'; return; }
  botToken=token;
  localStorage.setItem('fosnalic_token', token);
  els.authError.textContent='';
  hideModal();
  startBot();
}

async function apiCall(method, params={}){
  const fd=new FormData();
  for(const [k,v] of Object.entries(params)) fd.append(k,v);
  const res=await fetch(`https://api.telegram.org/bot${botToken}/${method}`,{method:'POST',body:fd});
  return res.json();
}

async function startBot(){
  try{
    els.status.textContent='Connecting...'; els.status.style.color='#aaa';
    const me=await apiCall('getMe');
    if(!me.ok) throw new Error(me.description||'Invalid token');
    log(`Connected as @${me.result.username}`,'success');
    els.status.textContent='Ready - Waiting for video'; els.status.style.color='var(--success)';
    if(!polling){ polling=true; pollUpdates(); }
  }catch(e){
    log(`Connection failed: ${e.message}`,'error');
    els.status.textContent='Connection Failed'; els.status.style.color='var(--error)';
    localStorage.removeItem('fosnalic_token');
    botToken=''; polling=false;
    showModal('Token invalid. Enter correct token.');
  }
}

async function pollUpdates(){
  while(polling){
    try{
      const res=await fetch(`https://api.telegram.org/bot${botToken}/getUpdates?timeout=25&offset=${lastUpdateId}`);
      const data=await res.json();
      if(data.ok){
        for(const update of data.result){
          lastUpdateId=update.update_id+1; // FIX: +1 or you get same update forever
          if(update.message?.video){
            processVideo(update.message).catch(err=>log(`Error: ${err.message}`,'error'));
          }
        }
      }
      if(!data.result?.length) await new Promise(r=>setTimeout(r,1000));
    }catch(e){
      log(`Poll error: ${e.message}`,'error');
      await new Promise(r=>setTimeout(r,5000));
    }
  }
}

async function getVideoDimensions(blob){
  return new Promise(resolve=>{
    const url=URL.createObjectURL(blob);
    const v=document.createElement('video');
    v.preload='metadata';
    v.onloadedmetadata=()=>{ URL.revokeObjectURL(url); resolve({width:v.videoWidth,height:v.videoHeight}); };
    v.onerror=()=>resolve({width:1280,height:720});
    v.src=url;
  });
}

async function ensureFFmpeg(){
  if(ffmpeg) return;
  ffmpeg=new FFmpeg();
  ffmpeg.on('progress', ({progress})=>{
    const pct=Math.min(100,Math.max(0,progress*100));
    setProgress(pct,`Encoding: ${Math.round(pct)}%`);
  });
  log('Loading FFmpeg...');
  const base='https://cdn.jsdelivr.net/npm/@ffmpeg/core@0.12.4/dist/umd';
  await ffmpeg.load({ coreURL: await toBlobURL(`${base}/ffmpeg-core.js`,'text/javascript'), wasmURL: await toBlobURL(`${base}/ffmpeg-core.wasm`,'application/wasm') });
  log('FFmpeg loaded.');
}

async function processVideo(msg){
  if(isProcessing){ log('Skipping: already processing one video'); return; }
  isProcessing=true;
  els.status.textContent='Processing...'; els.status.style.color='#ff9800';
  const chatId=msg.chat.id;
  const fileId=msg.video.file_id;
  const fileName=msg.video.file_name||'video.mp4';
  log(`Received video. Getting file path...`);
  try{
    // FIX: Must call getFile first
    const fileInfo=await apiCall('getFile',{file_id:fileId});
    if(!fileInfo.ok) throw new Error(fileInfo.description);
    const filePath=fileInfo.result.file_path;
    const fileUrl=`https://api.telegram.org/file/bot${botToken}/${filePath}`;
    const resp=await fetch(fileUrl);
    const blob=await resp.blob();
    log(`Downloaded ${(blob.size/1024/1024).toFixed(2)} MB`);
    const {width,height}=await getVideoDimensions(blob);
    log(`Source: ${width}x${height}`);

    await ensureFFmpeg();
    let scaleFilter='format=yuv420p';
    if(blob.size>15000000 && width>1280){
      scaleFilter=`scale=1280:-2,format=yuv420p`;
    }
    await ffmpeg.writeFile('input.mp4', await fetchFile(blob));
    log(`Encoding CRF ${currentQuality}...`);
    await ffmpeg.exec(['-i','input.mp4','-c:v','libx264','-crf',String(currentQuality),'-preset','ultrafast','-c:a','aac','-b:a','96k','-vf',scaleFilter,'-movflags','+faststart','-y','output.mp4']);
    const data=await ffmpeg.readFile('output.mp4');
    await ffmpeg.deleteFile('input.mp4');
    await ffmpeg.deleteFile('output.mp4');
    setProgress(100,'Uploading...');
    log('Uploading...');
    const fd=new FormData();
    fd.append('chat_id',chatId);
    fd.append('video', new Blob([data.buffer],{type:'video/mp4'}), fileName);
    const up=await fetch(`https://api.telegram.org/bot${botToken}/sendVideo`,{method:'POST',body:fd});
    const upJson=await up.json();
    if(!upJson.ok) throw new Error(upJson.description);
    log('Done!','success');
    els.status.textContent='Ready'; els.status.style.color='var(--success)';
  }catch(e){
    log(`Error: ${e.message}`,'error');
    els.status.textContent='Error'; els.status.style.color='var(--error)';
  }finally{
    isProcessing=false;
    setProgress(0,'');
    els.progressBarContainer.style.display='none';
  }
}
init();
</script>
</body>
</html>
