<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FOSNALIC — Telegram Browser Video Compressor</title>
  <script src="https://cdn.jsdelivr.net/npm/@ffmpeg/ffmpeg@0.12.10/dist/umd/ffmpeg.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@ffmpeg/util@0.12.1/dist/umd/index.min.js"></script>
  <style>
    * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
    body { background: #0f172a; color: #f8fafc; margin: 0; padding: 20px; display: flex; justify-content: center; }
    .card { width: 100%; max-width: 640px; background: #1e293b; border-radius: 12px; padding: 20px; border: 1px solid #334155; }
    h2 { margin-top: 0; font-size: 1.25rem; color: #38bdf8; }
    label { display: block; font-size: 0.85rem; color: #94a3b8; margin-bottom: 6px; }
    input, select { width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #475569; background: #0f172a; color: #fff; margin-bottom: 14px; }
    .row { display: flex; gap: 10px; }
    button { flex: 1; padding: 12px; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; }
    .btn-start { background: #0284c7; color: #fff; }
    .btn-stop { background: #dc2626; color: #fff; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    #log { background: #020617; border: 1px solid #334155; border-radius: 8px; padding: 12px; height: 280px; overflow-y: auto; font-family: monospace; font-size: 0.8rem; line-height: 1.5; margin-top: 16px; white-space: pre-wrap; }
    .feed { margin-top: 14px; background: #0f172a; border: 1px solid #334155; border-radius: 8px; padding: 12px; }
    .feed-title { font-size: 0.85rem; color: #94a3b8; margin-bottom: 8px; font-weight: 600; }
    .feed-item { font-size: 0.8rem; padding: 6px 0; border-bottom: 1px solid #1e293b; color: #e2e8f0; }
    .feed-item:last-child { border-bottom: none; }
    .ok { color: #4ade80; }
    .err { color: #f87171; }
    .info { color: #38bdf8; }
    .warn { color: #fbbf24; }
  </style>
  <script src="/fosnalic-announcements.js" defer></script>
</head>
<body>
  <div class="card">
    <h2>⚡ Telegram Video Compressor Worker</h2>

    <label for="token">Telegram Bot API Token (Saved locally in browser)</label>
    <input type="password" id="token" placeholder="123456789:ABCdefGHIjklMNOpqrsTUVwxyz" />

    <label for="webhookUrl">Website API Endpoint</label>
    <input type="text" id="webhookUrl" placeholder="/api/video-compressed" />

    <div class="row">
      <div style="flex:1">
        <label for="crf">Compression (CRF: 24=High, 28=Balanced, 32=Small)</label>
        <select id="crf">
          <option value="24">24 — High Quality</option>
          <option value="28" selected>28 — Balanced (Recommended)</option>
          <option value="32">32 — Heavy Compression</option>
        </select>
      </div>
      <div style="flex:1">
        <label for="scale">Max Width</label>
        <select id="scale">
          <option value="iw">Original Resolution</option>
          <option value="1280">720p (1280px)</option>
          <option value="854" selected>480p (854px)</option>
        </select>
      </div>
    </div>

    <div class="row">
      <button id="startBtn" class="btn-start">Start Listening</button>
      <button id="stopBtn" class="btn-stop" disabled>Stop</button>
    </div>

    <div id="log">Initializing...</div>

    <div class="feed">
      <div class="feed-title">Recent Resends Sent to API</div>
      <div id="feedList">None yet.</div>
    </div>
  </div>

  <script>
    const { FFmpeg } = FFmpegWASM;
    const { fetchFile, toBlobURL } = FFmpegUtil;

    const MAX_BOT_API_BYTES = 20 * 1024 * 1024;
    const tokenInput = document.getElementById("token");
    const webhookInput = document.getElementById("webhookUrl");
    const crfSelect = document.getElementById("crf");
    const scaleSelect = document.getElementById("scale");
    const startBtn = document.getElementById("startBtn");
    const stopBtn = document.getElementById("stopBtn");
    const logEl = document.getElementById("log");
    const feedListEl = document.getElementById("feedList");

    tokenInput.value = localStorage.getItem("tg_bot_token") || "";
    webhookInput.value = localStorage.getItem("fosnalic_site_webhook") || "/api/video-compressed";

    const siteChannel = new BroadcastChannel("fosnalic_video_events");

    let ffmpeg = null;
    let isRunning = false;
    let isProcessing = false;
    let lastUpdateId = 0;
    let pollAbortController = null;
    let hasFeedItems = false;
    const queue = [];

    function log(msg, cls = "") {
      const time = new Date().toLocaleTimeString();
      const span = document.createElement("div");
      if (cls) span.className = cls;
      span.textContent = `[${time}] ${msg}`;
      logEl.appendChild(span);
      logEl.scrollTop = logEl.scrollHeight;
    }

    window.addEventListener("error", (e) => {
      log(`Uncaught error: ${e.message} (${e.filename || "inline"}:${e.lineno || 0})`, "err");
    });

    window.addEventListener("unhandledrejection", (e) => {
      const reason = e.reason?.message || String(e.reason || "Unknown promise rejection");
      log(`Unhandled promise rejection: ${reason}`, "err");
    });

    function addFeedItem(payload) {
      if (!hasFeedItems) {
        feedListEl.innerHTML = "";
        hasFeedItems = true;
      }
      const row = document.createElement("div");
      row.className = "feed-item";
      row.textContent = `${payload.fileName} (${payload.oldSizeMB} MB → ${payload.newSizeMB} MB in ${payload.elapsedSec}s) — chat ${payload.chatId}`;
      feedListEl.prepend(row);
    }

    async function initFFmpeg() {
      if (ffmpeg) return;
      log("Loading FFmpeg.wasm core (~30MB, cached after first load)...", "info");
      ffmpeg = new FFmpeg();

      let lastPct = -1;
      ffmpeg.on("progress", ({ progress }) => {
        const pct = Math.round(progress * 100);
        if (pct > 0 && pct <= 100 && pct !== lastPct && pct % 15 === 0) {
          lastPct = pct;
          log(`Encoding: ${pct}%`);
        }
      });

      ffmpeg.on("log", ({ message }) => {
        if (message && (message.includes("Error") || message.includes("error") || message.includes("Invalid"))) {
          log(`FFmpeg: ${message}`, "warn");
        }
      });

      const baseURL = "https://cdn.jsdelivr.net/npm/@ffmpeg/core@0.12.6/dist/umd";
      await ffmpeg.load({
        coreURL: await toBlobURL(`${baseURL}/ffmpeg-core.js`, "text/javascript"),
        wasmURL: await toBlobURL(`${baseURL}/ffmpeg-core.wasm`, "application/wasm"),
      });
      log("FFmpeg engine ready.", "ok");
    }

    async function tgApi(token, method, body = null, isFormData = false, signal = undefined) {
      const url = `https://api.telegram.org/bot${token}/${method}`;
      const opts = body
        ? {
            method: "POST",
            headers: isFormData ? {} : { "Content-Type": "application/json" },
            body: isFormData ? body : JSON.stringify(body),
            signal,
          }
        : { method: "GET", signal };

      const res = await fetch(url, opts);
      const text = await res.text();
      try {
        return JSON.parse(text);
      } catch {
        throw new Error(`Non-JSON Telegram response (HTTP ${res.status}): ${text.slice(0, 160)}`);
      }
    }

    async function notifyWebsiteAfterResend(payload) {
      siteChannel.postMessage({ type: "VIDEO_RESENT", payload });
      window.dispatchEvent(new CustomEvent("fosnalic:video-resent", { detail: payload }));
      addFeedItem(payload);

      const endpoint = webhookInput.value.trim();
      if (!endpoint) {
        log("No API endpoint set; skipped HTTP POST.", "warn");
        return;
      }

      try {
        const res = await fetch(endpoint, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload),
          keepalive: true,
        });
        const data = await res.json().catch(() => ({}));
        if (res.ok) {
          log(`API acknowledged (${endpoint}) at ${data.receivedAt || "now"}.`, "ok");
        } else {
          log(`API returned HTTP ${res.status}: ${data.error || "Unknown error"}`, "err");
        }
      } catch (err) {
        log(`Could not reach API (${endpoint}): ${err.message}`, "err");
      }
    }

    async function processVideo(token, job) {
      const { chatId, fileId, originalSize, fileName } = job;
      const jobId = `${Date.now()}_${Math.random().toString(36).slice(2, 7)}`;
      const inName = `in_${jobId}.mp4`;
      const outName = `out_${jobId}.mp4`;
      const startedAt = performance.now();

      try {
        if (originalSize && originalSize > MAX_BOT_API_BYTES) {
          throw new Error("File exceeds Telegram Bot API's 20 MB download limit.");
        }

        await tgApi(token, "sendMessage", {
          chat_id: chatId,
          text: "⏳ Video received. Compressing & sending back fast...",
        });

        const fileInfo = await tgApi(token, "getFile", { file_id: fileId });
        if (!fileInfo.ok) {
          throw new Error(fileInfo.description || "Failed to get file info from Telegram.");
        }

        const fileUrl = `https://api.telegram.org/file/bot${token}/${fileInfo.result.file_path}`;
        log(`Downloading ${originalSize ? (originalSize / 1024 / 1024).toFixed(2) + " MB" : "video"}...`, "info");

        const rawBytes = await fetchFile(fileUrl);
        const actualSize = originalSize || rawBytes.byteLength || 0;
        await ffmpeg.writeFile(inName, rawBytes);

        const crf = crfSelect.value;
        const width = scaleSelect.value;
        const scaleFilter =
          width === "iw"
            ? "scale=trunc(iw/2)*2:trunc(ih/2)*2"
            : `scale='min(${width},iw)':-2`;

        log(`Compressing fast (CRF ${crf}, max width ${width})...`, "info");
        await ffmpeg.exec([
          "-i", inName,
          "-map", "0:v:0",
          "-map", "0:a?",
          "-vf", scaleFilter,
          "-c:v", "libx264",
          "-crf", crf,
          "-preset", "ultrafast",
          "-c:a", "aac",
          "-b:a", "96k",
          "-movflags", "+faststart",
          outName,
        ]);

        const data = await ffmpeg.readFile(outName);
        const compressedBlob = new Blob([data.buffer], { type: "video/mp4" });
        const newSizeMB = Number((compressedBlob.size / 1024 / 1024).toFixed(2));
        const oldSizeMB = Number((actualSize / 1024 / 1024).toFixed(2));
        const elapsedSec = Number(((performance.now() - startedAt) / 1000).toFixed(1));

        log(`Done in ${elapsedSec}s! ${oldSizeMB} MB → ${newSizeMB} MB. Resending...`, "ok");

        const formData = new FormData();
        formData.append("chat_id", chatId);
        formData.append("video", compressedBlob, "compressed.mp4");
        formData.append("caption", `✅ Compressed in ${elapsedSec}s: ${oldSizeMB} MB → ${newSizeMB} MB`);
        formData.append("supports_streaming", "true");

        const sendRes = await tgApi(token, "sendVideo", formData, true);
        if (!sendRes.ok) throw new Error(sendRes.description);

        log("Compressed video resent to Telegram! Sending to API...", "ok");

        await notifyWebsiteAfterResend({
          status: "resent",
          chatId,
          fileId,
          compressedFileId: sendRes.result?.video?.file_id || null,
          fileName: fileName || "video.mp4",
          oldSizeMB,
          newSizeMB,
          elapsedSec,
          timestamp: new Date().toISOString(),
        });
      } catch (err) {
        log(`Process error: ${err.message}`, "err");
        await tgApi(token, "sendMessage", {
          chat_id: chatId,
          text: `❌ Compression failed: ${err.message}`,
        }).catch(() => {});
      } finally {
        if (ffmpeg) {
          await ffmpeg.deleteFile(inName).catch(() => {});
          await ffmpeg.deleteFile(outName).catch(() => {});
        }
      }
    }

    async function drainQueue(token) {
      if (isProcessing) return;
      isProcessing = true;
      try {
        while (queue.length > 0) {
          const nextJob = queue.shift();
          await processVideo(token, nextJob);
        }
      } catch (err) {
        log(`Queue error: ${err.message}`, "err");
      } finally {
        isProcessing = false;
      }
    }

    async function pollLoop(token) {
      while (isRunning) {
        pollAbortController = new AbortController();
        try {
          const data = await tgApi(
            token,
            "getUpdates",
            { offset: lastUpdateId + 1, timeout: 20 },
            false,
            pollAbortController.signal
          );

          if (!data.ok) {
            log(`Telegram getUpdates error: ${data.description || "Unknown error"}`, "err");
            await new Promise((r) => setTimeout(r, 3000));
            continue;
          }

          if (Array.isArray(data.result) && data.result.length > 0) {
            for (const update of data.result) {
              lastUpdateId = update.update_id;
              const msg = update.message || update.channel_post || update.edited_message;
              if (!msg) {
                log(`Update ${update.update_id} has no message payload.`, "warn");
                continue;
              }

              const video =
                msg.video ||
                (msg.document && msg.document.mime_type?.startsWith("video/")
                  ? msg.document
                  : null);

              if (!video) {
                log(`Message in chat ${msg.chat?.id ?? "unknown"} is not a video (${Object.keys(msg).join(", ")}).`, "info");
                continue;
              }

              log(`Video received from chat ${msg.chat.id} (${video.file_name || "video.mp4"}). Queueing...`, "info");
              queue.push({
                chatId: msg.chat.id,
                fileId: video.file_id,
                originalSize: video.file_size || 0,
                fileName: video.file_name || "video.mp4",
              });
              drainQueue(token);
            }
          }
        } catch (err) {
          if (err.name === "AbortError" || !isRunning) break;
          log(`Polling error: ${err.message}`, "err");
          await new Promise((r) => setTimeout(r, 3000));
        }
      }
    }

    async function startWorker(isAuto = false) {
      const token = tokenInput.value.trim();
      if (!token) {
        log(isAuto ? "Auto-listen skipped: no saved bot token found." : "Please enter your Telegram Bot Token.", "warn");
        if (!isAuto) alert("Please enter your Telegram Bot Token.");
        return;
      }

      if (isRunning) return;

      localStorage.setItem("tg_bot_token", token);
      localStorage.setItem("fosnalic_site_webhook", webhookInput.value.trim());

      startBtn.disabled = true;
      try {
        log(isAuto ? "Auto-starting worker..." : "Starting worker...", "info");
        await initFFmpeg();

        const wh = await tgApi(token, "deleteWebhook");
        if (!wh.ok) {
          throw new Error(`deleteWebhook failed: ${wh.description || "Unknown error"}`);
        }

        isRunning = true;
        stopBtn.disabled = false;
        log("Listening for videos sent to your bot...", "ok");
        pollLoop(token);
      } catch (e) {
        log(`Startup error: ${e.message}`, "err");
        isRunning = false;
        startBtn.disabled = false;
        stopBtn.disabled = true;
      }
    }

    startBtn.addEventListener("click", () => startWorker(false));

    stopBtn.addEventListener("click", () => {
      isRunning = false;
      if (pollAbortController) pollAbortController.abort();
      startBtn.disabled = false;
      stopBtn.disabled = true;
      log("Stopped listening.", "err");
    });

    window.addEventListener("DOMContentLoaded", () => {
      if (tokenInput.value.trim()) {
        startWorker(true);
      } else {
        log("Ready. Enter your Bot Token and click 'Start Listening'.", "info");
      }
    });
  </script>
  <script defer src="https://static.cloudflareinsights.com/beacon.min.js" data-cf-beacon='{"token": "f4043667174c4bcf8ce18fb577700342"}'></script>
</body>
</html>
