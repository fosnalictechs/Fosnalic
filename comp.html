<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FOSNALIC Compressor</title>
<script src="https://cdn.jsdelivr.net/npm/@ffmpeg/ffmpeg@0.12.15/dist/umd/ffmpeg.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@ffmpeg/util@0.12.1/dist/umd/util.js"></script>
<style>
body{font-family:system-ui,sans-serif;background:#121212;color:#e0e0e0;margin:0;padding:20px;display:flex;justify-content:center}
.container{width:100%;max-width:500px;display:flex;flex-direction:column;gap:15px}
h1{text-align:center}
.card{background:#1e1e1e;border-radius:12px;padding:20px;border:1px solid #333}
label{display:block;margin-bottom:8px;font-weight:bold}
input,select{width:100%;padding:12px;background:#2c2c2c;border:1px solid #333;border-radius:6px;color:#fff;box-sizing:border-box}
button{width:100%;padding:12px;background:#0088cc;color:#fff;border:none;border-radius:6px;font-weight:bold;cursor:pointer;margin-top:10px}
button:disabled{background:#555}
.log-entry{font-size:.85rem;padding:5px 0;border-bottom:1px solid #333;word-break:break-word}
.log-entry.error{color:#f44336}.log-entry.success{color:#4caf50}
.hidden{display:none!important}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.9);display:flex;justify-content:center;align-items:center;z-index:1000}
.modal-content{background:#1e1e1e;padding:30px;border-radius:12px;width:90%;max-width:400px;text-align:center}
</style>
</head>
<body>
<div class="container">
<h1>⚡ FOSNALIC Compressor</h1>
<div class="card">
<b>Status:</b> <span id="connectionStatus" style="color:yellow">Loading page...</span>
<div id="debugInfo" style="font-size:.75rem;color:#888;margin-top:8px"></div>
<button id="testBtn">🔍 TEST CONNECTION NOW</button>
<button id="changeTokenBtn" style="background:#444">Change / Clear Token</button>
</div>
<div class="card">
<label>Compression Level</label>
<select id="qualitySelect">
<option value="23">Balanced (Recommended)</option>
<option value="28">Aggressive (Smaller)</option>
<option value="18">Lossless (Larger)</option>
</select>
</div>
<div class="card">
<label>Activity Log - Watch here when you send video</label>
<div id="logs" style="max-height:300px;overflow-y:auto"></div>
</div>
</div>

<div id="authModal" class="modal-overlay hidden">
<div class="modal-content">
<h2>Enter Bot Token</h2>
<p>Paste your token from @BotFather</p>
<input type="text" id="tokenInput" placeholder="123456:ABC-DEF..." autocomplete="off">
<button id="startBtn">Start Compressor</button>
<p id="authError" style="color:#f44336"></p>
<p style="font-size:.8rem;color:#888">Token is saved only in YOUR browser, not on server.</p>
</div>
</div>

<script>
const { FFmpeg } = window.FFmpeg;
const { fetchFile } = window.FFmpegUtil;
let ffmpeg=null, botToken=localStorage.getItem('fosnalic_token')||'', lastUpdateId=0, isProcessing=false, polling=false;
let currentQuality=parseInt(localStorage.getItem('fosnalic_quality'))||23;

const els={
 modal:document.getElementById('authModal'),
 tokenInput:document.getElementById('tokenInput'),
 startBtn:document.getElementById('startBtn'),
 authError:document.getElementById('authError'),
 status:document.getElementById('connectionStatus'),
 debug:document.getElementById('debugInfo'),
 logs:document.getElementById('logs'),
 quality:document.getElementById('qualitySelect'),
 testBtn:document.getElementById('testBtn'),
 changeTokenBtn:document.getElementById('changeTokenBtn')
};

function log(msg,type='info'){
  const d=document.createElement('div'); d.className='log-entry '+type;
  d.textContent=`[${new Date().toLocaleTimeString()}] ${msg}`;
  els.logs.prepend(d);
  console.log(msg);
}
function setStatus(txt,color){ els.status.textContent=txt; els.status.style.color=color; }
function showModal(msg=''){ els.authError.textContent=msg; els.modal.classList.remove('hidden'); }
function hideModal(){ els.modal.classList.add('hidden'); }

// === THIS IS THE FIX: Never stay on Initializing ===
function init(){
  log('Page loaded. Checking token...');
  els.debug.textContent = 'SharedArrayBuffer: ' + (typeof SharedArrayBuffer !== 'undefined' ? 'YES ✅' : 'NO ❌ - _headers NOT working');
  els.quality.value=currentQuality;
  els.quality.onchange=e=>{ currentQuality=parseInt(e.target.value); localStorage.setItem('fosnalic_quality',currentQuality); log('Quality CRF '+currentQuality); };
  els.startBtn.onclick=handleAuth;
  els.tokenInput.onkeydown=e=>{ if(e.key==='Enter') handleAuth(); };
  els.testBtn.onclick=()=>{ log('Manual test clicked...'); startBot(); };
  els.changeTokenBtn.onclick=()=>{
    localStorage.removeItem('fosnalic_token'); botToken=''; polling=false;
    els.tokenInput.value=''; setStatus('Token cleared - enter new one','#ff9800'); showModal('Token cleared. Enter new one.');
  };

  if(!botToken){
    setStatus('No token - please enter token','#ff9800');
    log('No token found. Showing popup...','error');
    showModal();
  } else {
    log('Token found in storage, testing it...');
    startBot();
  }
}

async function handleAuth(){
  const t=els.tokenInput.value.trim();
  if(!t || !t.includes(':')){ els.authError.textContent='Invalid token. Must contain :'; return; }
  botToken=t; localStorage.setItem('fosnalic_token',t);
  hideModal(); log('Token saved. Connecting...');
  startBot();
}

async function apiCall(method, params={}){
  const fd=new FormData();
  for(const [k,v] of Object.entries(params)) fd.append(k,v);
  const res=await fetch(`https://api.telegram.org/bot${botToken}/${method}`,{method:'POST',body:fd});
  return res.json();
}

async function startBot(){
  setStatus('Connecting to Telegram...','#ff9800');
  try{
    log('Calling getMe...');
    const me=await apiCall('getMe');
    if(!me.ok) throw new Error(me.description||'Invalid token - check token from @BotFather');
    log(`✅ Connected as @${me.result.username}`,'success');
    setStatus('✅ Ready - Send a video to your bot','#4caf50');
    if(!polling){ polling=true; pollUpdates(); }
  }catch(e){
    log(`❌ Connection failed: ${e.message}`,'error');
    setStatus('❌ Connection Failed - See log','#f44336');
    // Don't delete token immediately, show error so user can see it
    showModal('Failed: '+e.message);
  }
}

async function pollUpdates(){
  log('Started listening for videos... Keep this page OPEN');
  while(polling){
    try{
      const res=await fetch(`https://api.telegram.org/bot${botToken}/getUpdates?timeout=20&offset=${lastUpdateId}`);
      const data=await res.json();
      if(data.ok){
        for(const u of data.result){
          lastUpdateId=u.update_id+1;
          if(u.message?.video){
            log('📹 VIDEO RECEIVED! Starting compression...','success');
            processVideo(u.message).catch(err=>log('Error: '+err.message,'error'));
          } else if(u.message?.text){
            log(`Message received: "${u.message.text}" - send a VIDEO, not text`);
          }
        }
      }
      if(!data.result?.length) await new Promise(r=>setTimeout(r,1500));
    }catch(e){
      log('Poll error: '+e.message,'error');
      await new Promise(r=>setTimeout(r,5000));
    }
  }
}

async function getVideoDimensions(blob){
  return new Promise(resolve=>{
    const url=URL.createObjectURL(blob); const v=document.createElement('video');
    v.preload='metadata';
    v.onloadedmetadata=()=>{ URL.revokeObjectURL(url); resolve({width:v.videoWidth,height:v.videoHeight}); };
    v.onerror=()=>resolve({width:1280,height:720}); v.src=url;
  });
}
async function ensureFFmpeg(){
  if(ffmpeg) return;
  ffmpeg=new FFmpeg();
  log('Loading FFmpeg... This takes 10-20 sec first time');
  await ffmpeg.load({
    coreURL:'https://cdn.jsdelivr.net/npm/@ffmpeg/core@0.12.6/dist/umd/ffmpeg-core.js',
    wasmURL:'https://cdn.jsdelivr.net/npm/@ffmpeg/core@0.12.6/dist/umd/ffmpeg-core.wasm',
  });
  log('FFmpeg loaded ✅');
}
async function processVideo(msg){
  if(isProcessing){ log('Busy, skipping'); return; }
  isProcessing=true; setStatus('⏳ Processing video...','#ff9800');
  try{
    const chatId=msg.chat.id; const fileId=msg.video.file_id;
    const info=await apiCall('getFile',{file_id:fileId});
    if(!info.ok) throw new Error(info.description);
    const url=`https://api.telegram.org/file/bot${botToken}/${info.result.file_path}`;
    log('Downloading video from Telegram...');
    const blob=await (await fetch(url)).blob();
    log(`Downloaded ${(blob.size/1024/1024).toFixed(2)} MB`);
    const {width}=await getVideoDimensions(blob);
    await ensureFFmpeg();
    await ffmpeg.writeFile('input.mp4', await fetchFile(blob));
    log(`Encoding CRF ${currentQuality}... Please wait`);
    let vf='format=yuv420p';
    if(blob.size>15000000 && width>1280) vf='scale=1280:-2,format=yuv420p';
    await ffmpeg.exec(['-i','input.mp4','-c:v','libx264','-crf',String(currentQuality),'-preset','ultrafast','-c:a','aac','-b:a','96k','-vf',vf,'-movflags','+faststart','-y','output.mp4']);
    const data=await ffmpeg.readFile('output.mp4');
    await ffmpeg.deleteFile('input.mp4'); await ffmpeg.deleteFile('output.mp4');
    log(`Encoded to ${(data.length/1024/1024).toFixed(2)} MB. Uploading back...`);
    const fd=new FormData(); fd.append('chat_id',chatId); fd.append('video', new Blob([data.buffer],{type:'video/mp4'}), 'compressed.mp4');
    const up=await fetch(`https://api.telegram.org/bot${botToken}/sendVideo`,{method:'POST',body:fd});
    const upJ=await up.json(); if(!upJ.ok) throw new Error(upJ.description);
    log('✅ DONE! Compressed video sent back to you!','success');
    setStatus('✅ Ready - Send another video','#4caf50');
  }catch(e){ log('❌ Error: '+e.message,'error'); setStatus('❌ Error - see log','#f44336'); }
  finally{ isProcessing=false; }
}
init();
</script>
</body>
</html>
