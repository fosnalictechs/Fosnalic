<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FOSNALIC Compressor</title>
<script src="https://cdn.jsdelivr.net/npm/@ffmpeg/ffmpeg@0.12.15/dist/umd/ffmpeg.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@ffmpeg/util@0.12.1/dist/umd/util.js"></script>
<style>
body{font-family:system-ui,sans-serif;background:#121212;color:#e0e0e0;margin:0;padding:20px;display:flex;justify-content:center}
.container{width:100%;max-width:500px;display:flex;flex-direction:column;gap:15px}
h1{text-align:center}
.card{background:#1e1e1e;border-radius:12px;padding:20px;border:1px solid #333}
label{display:block;margin-bottom:8px;font-weight:bold}
input,select{width:100%;padding:12px;background:#2c2c2c;border:1px solid #333;border-radius:6px;color:#fff;box-sizing:border-box}
button{width:100%;padding:12px;background:#0088cc;color:#fff;border:none;border-radius:6px;font-weight:bold;cursor:pointer;margin-top:10px}
button.green{background:#4caf50} button.grey{background:#444}
.log-entry{font-size:.85rem;padding:5px 0;border-bottom:1px solid #333;word-break:break-word}
.log-entry.error{color:#f44336}.log-entry.success{color:#4caf50}
</style>
</head>
<body>
<div class="container">
<h1>⚡ FOSNALIC Compressor</h1>

<div class="card">
<label>1. YOUR BOT TOKEN</label>
<input type="text" id="tokenInput" placeholder="123456:ABC-DEF..." autocomplete="off">
<button id="startBtn">✅ SAVE TOKEN & CONNECT</button>
<button id="clearBtn" class="grey">Clear Token</button>
<div style="margin-top:12px"><b>Status:</b> <span id="connectionStatus" style="color:yellow">Loading...</span></div>
<div id="debugInfo" style="font-size:.75rem;color:#888;margin-top:8px"></div>
<div id="chatInfo" style="font-size:.85rem;color:#4caf50;margin-top:8px"></div>
</div>

<div class="card">
<label>2. TEST BOT - It will send YOU a message</label>
<p style="font-size:.85rem;color:#aaa">First send ANY message to your bot on Telegram (like "hi"), then click below.</p>
<button id="testMsgBtn" class="green">📩 SEND TEST MESSAGE TO ME</button>
<button id="testConnBtn">🔍 TEST CONNECTION</button>
</div>

<div class="card">
<label>3. Compression Level</label>
<select id="qualitySelect">
<option value="23">Balanced (Recommended)</option>
<option value="28">Aggressive (Smaller)</option>
<option value="18">Lossless (Larger)</option>
</select>
</div>

<div class="card">
<label>Activity Log</label>
<div id="logs" style="max-height:300px;overflow-y:auto"></div>
</div>
</div>

<script>
const { FFmpeg } = window.FFmpeg;
const { fetchFile } = window.FFmpegUtil;
let ffmpeg=null, botToken=localStorage.getItem('fosnalic_token')||'', lastUpdateId=0, isProcessing=false, polling=false, lastChatId=null;
let currentQuality=parseInt(localStorage.getItem('fosnalic_quality'))||23;

const els={
 tokenInput:document.getElementById('tokenInput'),
 startBtn:document.getElementById('startBtn'),
 clearBtn:document.getElementById('clearBtn'),
 status:document.getElementById('connectionStatus'),
 debug:document.getElementById('debugInfo'),
 chatInfo:document.getElementById('chatInfo'),
 logs:document.getElementById('logs'),
 quality:document.getElementById('qualitySelect'),
 testMsgBtn:document.getElementById('testMsgBtn'),
 testConnBtn:document.getElementById('testConnBtn')
};

function log(m,t='info'){
  const d=document.createElement('div');
  d.className='log-entry '+t;
  d.textContent='['+new Date().toLocaleTimeString()+'] '+m;
  els.logs.prepend(d);
}
function setStatus(t,c){ els.status.textContent=t; els.status.style.color=c; }

function init(){
  els.debug.textContent='SharedArrayBuffer: '+(typeof SharedArrayBuffer!=='undefined'?'YES ✅':'NO ❌ - _headers missing');
  els.quality.value=currentQuality;
  els.quality.onchange=e=>{ currentQuality=parseInt(e.target.value); localStorage.setItem('fosnalic_quality',currentQuality); };

  els.startBtn.onclick=()=>{
    const t=els.tokenInput.value.trim();
    if(!t||!t.includes(':')){ log('Invalid token - must contain :','error'); setStatus('Invalid token','#f44336'); return; }
    botToken=t; localStorage.setItem('fosnalic_token',t); log('Token saved. Connecting...'); startBot();
  };
  els.clearBtn.onclick=()=>{ localStorage.removeItem('fosnalic_token'); botToken=''; els.tokenInput.value=''; polling=false; setStatus('Token cleared - paste new one','#ff9800'); log('Token cleared'); };
  els.testConnBtn.onclick=()=>startBot();
  els.testMsgBtn.onclick=sendTestMessage;
  els.tokenInput.onkeydown=e=>{ if(e.key==='Enter') els.startBtn.click(); };

  // AUTO-LOGIN FROM LINK ?token=...
  const urlToken=new URLSearchParams(window.location.search).get('token');
  if(urlToken){
    botToken=urlToken.trim();
    localStorage.setItem('fosnalic_token',botToken);
    els.tokenInput.value=botToken;
    log('Token found in link! Auto-connecting...');
    startBot();
    return;
  }

  if(botToken){
    els.tokenInput.value=botToken;
    log('Token found in storage. Click SAVE TOKEN & CONNECT');
    setStatus('Token found - click SAVE TOKEN & CONNECT','#ff9800');
  }else{
    log('No token saved. Paste token above or use ?token= link');
    setStatus('Waiting for token...','#ff9800');
  }
}

async function apiCall(method, params={}){
  const fd=new FormData();
  for(const [k,v] of Object.entries(params)) fd.append(k,v);
  const res=await fetch('https://api.telegram.org/bot'+botToken+'/'+method,{method:'POST',body:fd});
  return res.json();
}

async function startBot(){
  if(!botToken){ log('Paste token first','error'); return; }
  setStatus('Connecting...','#ff9800');
  try{
    const me=await apiCall('getMe');
    if(!me.ok) throw new Error(me.description||'Invalid token');
    log('✅ Connected as @'+me.result.username,'success');
    setStatus('✅ Ready as @'+me.result.username+' - Send video to bot','#4caf50');
    if(!polling){ polling=true; pollUpdates(); }
  }catch(e){ log('❌ '+e.message,'error'); setStatus('❌ Failed: '+e.message,'#f44336'); }
}

async function sendTestMessage(){
  if(!botToken){ log('Paste token first','error'); return; }
  log('Looking for your chat... Send "hi" to bot first if not found');
  try{
    const res=await fetch('https://api.telegram.org/bot'+botToken+'/getUpdates?timeout=5&offset='+lastUpdateId);
    const data=await res.json();
    if(data.ok){
      for(const u of data.result){ lastUpdateId=u.update_id+1; if(u.message && u.message.chat && u.message.chat.id) lastChatId=u.message.chat.id; }
    }
    if(!lastChatId){ log('❌ I cannot find you. Go to Telegram, send "hi" to your bot, then click this button again.','error'); return; }
    els.chatInfo.textContent='Your Chat ID: '+lastChatId;
    const send=await apiCall('sendMessage',{chat_id:lastChatId, text:'✅ Hello! This is FOSNALIC. Your bot is WORKING! Now send me a VIDEO to compress it.'});
    if(send.ok){ log('✅ TEST MESSAGE SENT! Check your Telegram now!','success'); setStatus('✅ Test message sent - check Telegram','#4caf50'); }
    else log('Failed to send: '+send.description,'error');
  }catch(e){ log('Error: '+e.message,'error'); }
}

async function pollUpdates(){
  log('Listening... Keep this page OPEN');
  while(polling){
    try{
      const res=await fetch('https://api.telegram.org/bot'+botToken+'/getUpdates?timeout=20&offset='+lastUpdateId);
      const data=await res.json();
      if(data.ok){
        for(const u of data.result){
          lastUpdateId=u.update_id+1;
          if(u.message && u.message.chat && u.message.chat.id) lastChatId=u.message.chat.id;
          if(u.message && u.message.video){ log('📹 VIDEO RECEIVED! Compressing...','success'); processVideo(u.message); }
          else if(u.message && u.message.text){ log('Message from you: "'+u.message.text+'"'); }
        }
      }
      if(!data.result || !data.result.length) await new Promise(r=>setTimeout(r,1500));
    }catch(e){ log('Poll error: '+e.message,'error'); await new Promise(r=>setTimeout(r,5000)); }
  }
}

async function getDims(blob){
  return new Promise(res=>{
    const u=URL.createObjectURL(blob);
    const v=document.createElement('video');
    v.preload='metadata';
    v.onloadedmetadata=()=>{ URL.revokeObjectURL(u); res({width:v.videoWidth}); };
    v.onerror=()=>res({width:1280});
    v.src=u;
  });
}
async function ensureFFmpeg(){
  if(ffmpeg) return;
  ffmpeg=new FFmpeg();
  log('Loading FFmpeg... 10-20 sec');
  await ffmpeg.load({
    coreURL:'https://cdn.jsdelivr.net/npm/@ffmpeg/core@0.12.6/dist/umd/ffmpeg-core.js',
    wasmURL:'https://cdn.jsdelivr.net/npm/@ffmpeg/core@0.12.6/dist/umd/ffmpeg-core.wasm'
  });
  log('FFmpeg loaded ✅');
}
async function processVideo(msg){
  if(isProcessing) return;
  isProcessing=true; setStatus('⏳ Processing...','#ff9800');
  try{
    const info=await apiCall('getFile',{file_id:msg.video.file_id});
    if(!info.ok) throw new Error(info.description);
    const blob=await (await fetch('https://api.telegram.org/file/bot'+botToken+'/'+info.result.file_path)).blob();
    log('Downloaded '+(blob.size/1024/1024).toFixed(2)+' MB');
    const dims=await getDims(blob);
    await ensureFFmpeg();
    await ffmpeg.writeFile('input.mp4', await fetchFile(blob));
    let vf='format=yuv420p';
    if(blob.size>15000000 && dims.width>1280) vf='scale=1280:-2,format=yuv420p';
    await ffmpeg.exec(['-i','input.mp4','-c:v','libx264','-crf',String(currentQuality),'-preset','ultrafast','-c:a','aac','-b:a','96k','-vf',vf,'-movflags','+faststart','-y','output.mp4']);
    const data=await ffmpeg.readFile('output.mp4');
    await ffmpeg.deleteFile('input.mp4'); await ffmpeg.deleteFile('output.mp4');
    log('Encoded to '+(data.length/1024/1024).toFixed(2)+' MB. Uploading...');
    const fd=new FormData();
    fd.append('chat_id',msg.chat.id);
    fd.append('video',new Blob([data.buffer],{type:'video/mp4'}),'compressed.mp4');
    const up=await fetch('https://api.telegram.org/bot'+botToken+'/sendVideo',{method:'POST',body:fd});
    const upJ=await up.json();
    if(!upJ.ok) throw new Error(upJ.description);
    log('✅ DONE! Check Telegram!','success');
    setStatus('✅ Ready','#4caf50');
  }catch(e){ log('❌ '+e.message,'error'); setStatus('❌ Error','#f44336'); }
  finally{ isProcessing=false; }
}
init();
</script>
</body>
</html>
