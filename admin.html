<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin V5.0 Professional - FOSNALIC Techs</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
:root{--primary:#1A365D;--accent:#FF6B35;--bg:#F5F7FA;--card:#FFFFFF;--border:#E2E8F0;--ok:#16A34A;--err:#E53E3E}
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',system-ui}
body{background:var(--bg);color:#1A202C}
.header{background:var(--card);padding:14px 20px;box-shadow:0 2px 12px rgba(0,0,0,.06);position:sticky;top:0;z-index:100;display:flex;justify-content:space-between;align-items:center;max-width:1280px;margin:0 auto 16px;border-radius:0 0 14px 14px}
.header h1{color:var(--primary);font-size:1.2rem;font-weight:800;display:flex;align-items:center;gap:10px}
.header h1 i{color:var(--accent)}
.card{background:var(--card);border-radius:16px;padding:18px;box-shadow:0 8px 24px rgba(0,0,0,.06);margin:0 auto 16px;max-width:1280px;border:1px solid var(--border)}
h3{color:var(--primary);margin-bottom:12px;font-size:1.05rem;display:flex;align-items:center;gap:8px}
h3 i{color:var(--accent)}
input,textarea,select{width:100%;padding:11px 12px;border:1px solid var(--border);border-radius:10px;margin:6px 0;font-size:.92rem;outline:none;transition:.2s}
input:focus,textarea:focus,select:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(26,54,93,.12)}
button{padding:10px 16px;border:none;border-radius:10px;cursor:pointer;font-weight:700;font-size:.88rem;transition:.2s;display:inline-flex;align-items:center;gap:6px}
button:hover{transform:translateY(-1px);box-shadow:0 6px 14px rgba(0,0,0,.12)}
.btn-primary{background:var(--primary);color:#fff}.btn-accent{background:var(--accent);color:#fff}.btn-dark{background:#111827;color:#fff}.btn-ghost{background:#F1F5F9;color:var(--primary)}.btn-danger{background:var(--err);color:#fff}
.tabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px;background:#EEF2F7;padding:6px;border-radius:12px}
.tab{padding:9px 16px;background:transparent;border-radius:9px;cursor:pointer;font-weight:700;font-size:.85rem;color:#475569}
.tab.active{background:var(--primary);color:#fff;box-shadow:0 4px 10px rgba(26,54,93,.25)}
.hidden{display:none}
.file-btn{padding:7px 14px;background:#fff;border:1px solid var(--border);border-radius:20px;font-size:.82rem;font-weight:600}
.file-btn.active{background:var(--primary);color:#fff;border-color:var(--primary)}
.badge{padding:3px 8px;border-radius:20px;font-size:.7rem;font-weight:700}
.badge-ok{background:#DCFCE7;color:#166534}.badge-warn{background:#FEF3C7;color:#92400E}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:700px){.grid-2{grid-template-columns:1fr}}
.item-row{display:flex;justify-content:space-between;align-items:center;padding:8px 10px;border:1px solid #F1F5F9;border-radius:10px;margin:6px 0;background:#FAFBFC}
.ok{color:var(--ok);font-size:.84rem;font-weight:600}.err{color:var(--err);font-size:.84rem}
.stat{display:flex;gap:12px;flex-wrap:wrap;margin:10px 0}
.stat div{background:#F8FAFC;border:1px solid var(--border);padding:10px 14px;border-radius:12px;min-width:120px}
.stat b{color:var(--primary);font-size:1.1rem}
</style></head><body>
<div class="header"><h1><i class="fas fa-shield-halved"></i> FOSNALIC Admin V5.0</h1><div><span id="cfgOk" class="ok"></span> <span id="cfgErr" class="err"></span></div></div>

<div class="card" style="border-left:4px solid var(--primary)"><h3><i class="fas fa-gear"></i> GitHub Connection</h3>
<div class="grid-2"><input id="ghOwner" placeholder="Owner"><input id="ghRepo" placeholder="Repo"></div>
<div class="grid-2"><input id="ghBranch" placeholder="Branch"><input id="ghToken" type="password" placeholder="ghp_ token"></div>
<div style="display:flex;gap:8px;margin-top:8px"><button class="btn-primary" onclick="saveConfig()"><i class="fas fa-floppy-disk"></i> Save & Connect</button><button class="btn-ghost" onclick="listRepoFiles()"><i class="fas fa-rotate"></i> Reload Files</button></div>
<div class="stat"><div><small>Repo Files</small><br><b id="fileCount">-</b></div><div><small>Gist ID</small><br><b id="gistIdShort" style="font-size:.75rem">-</b></div><div><small>Ads</small><br><b id="statAds">0</b></div><div><small>News</small><br><b id="statNews">0</b></div></div>
</div>

<div class="card">
<div class="tabs"><span class="tab active" onclick="showTab('ticker',this)"><i class="fas fa-bullhorn"></i> Ticker</span><span class="tab" onclick="showTab('ads',this)"><i class="fas fa-rectangle-ad"></i> Ads</span><span class="tab" onclick="showTab('news',this)"><i class="fas fa-newspaper"></i> Updates</span><span class="tab" onclick="showTab('pages',this)"><i class="fas fa-file-code"></i> Pages</span><span class="tab" onclick="showTab('self',this)"><i class="fas fa-code-compare"></i> Self Update</span></div>

<div id="tab-ticker"><h3><i class="fas fa-bullhorn"></i> Ticker Marquee (Moving Top)</h3><div style="display:flex;gap:8px"><input id="tickerInput" placeholder="Add new ticker message"><button class="btn-primary" onclick="addTicker()">Add</button></div><div id="tickerList" style="margin-top:10px"></div><button class="btn-dark" style="width:100%;margin-top:10px" onclick="fixTickerNow()"><i class="fas fa-broom"></i> Clean Old School Ads From Ticker</button></div>

<div id="tab-ads" class="hidden"><h3><i class="fas fa-rectangle-ad"></i> Ads & Popups</h3>
<div class="grid-2"><select id="adType"><option value="floating-br">🟣 Floating Bottom Right (stack)</option><option value="floating-bl">🟣 Floating Bottom Left</option><option value="banner">📦 Banner Slot</option><option value="sticky-bottom">🟡 Sticky Bottom (once)</option><option value="top-bar">🟢 Top Bar (once)</option><option value="fullscreen">🔴 Fullscreen Popup (once)</option></select><select id="adSlot"><option value="floating">Floating Layer</option><option value="adHeader">Header Slot</option><option value="adMiddle">Middle Slot</option><option value="adFooter">Footer Slot</option></select></div>
<textarea id="adText" style="min-height:110px" placeholder="<div>Your ad HTML here - keep professional"></textarea>
<div style="display:flex;gap:10px;flex-wrap:wrap;margin:6px 0"><label><input type="checkbox" id="adClosable" checked style="width:auto"> Show X</label><label><input type="checkbox" id="adEnabled" checked style="width:auto"> Enabled</label><label><input type="checkbox" id="adShowOnce" checked style="width:auto"> Show Once Per User</label></div>
<button class="btn-primary" style="width:100%" onclick="saveAd()"><i class="fas fa-plus"></i> Save Ad Live</button>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px"><button class="btn-dark" onclick="clearAllBanners()"><i class="fas fa-trash"></i> Clear All Ads + Banners</button><button class="btn-ghost" onclick="clearSeen()"><i class="fas fa-eye"></i> Reset Popup Views</button></div>
<div style="margin-top:12px;padding:10px;background:#FFF7ED;border-radius:10px" id="bannerStatus"></div>
<div id="adsList" style="margin-top:10px"></div></div>

<div id="tab-news" class="hidden"><h3><i class="fas fa-newspaper"></i> Latest Updates / News</h3><input id="newsTitle" placeholder="Title"><textarea id="newsDesc" placeholder="Description - keep professional tone"></textarea><div class="grid-2"><input id="newsTag" placeholder="Tag (e.g., Launch)"><input id="newsImg" placeholder="Image URL"></div><div style="display:flex;gap:8px"><input type="file" id="newsFile" accept="image/*"><button class="btn-ghost" onclick="uploadImage()"><i class="fas fa-upload"></i> Upload</button></div><span id="newsUploadStatus" class="ok"></span><button class="btn-dark" style="width:100%;margin-top:8px" onclick="saveNews()"><i class="fas fa-floppy-disk"></i> Save Update</button><div id="newsList" style="margin-top:10px"></div></div>

<div id="tab-pages" class="hidden"><h3><i class="fas fa-file-code"></i> Website Pages (Professional)</h3><div style="padding:10px;background:#E0F2FF;border-radius:10px;margin-bottom:12px;display:flex;justify-content:space-between;flex-wrap:wrap"><span>Repo: <b id="repoName">-</b></span><span>HTML files: <b id="fileCount2">-</b></span></div><div style="display:flex;flex-wrap:wrap;gap:6px" id="pageButtons">Click Save & Connect to load pages</div><div class="grid-2" style="margin-top:12px"><input id="newPageName" placeholder="new-page.html"><button class="btn-ghost" onclick="createPage()"><i class="fas fa-plus"></i> Create New Page</button></div><textarea id="pageEditor" style="min-height:520px;font-family:Consolas,monospace;font-size:.84rem;margin-top:12px;background:#0F172A;color:#E2E8F0"></textarea><div style="display:flex;gap:8px;margin-top:10px"><button class="btn-dark" style="flex:1" onclick="savePageToGitHub()"><i class="fas fa-floppy-disk"></i> Save Page (Auto SHA)</button><button class="btn-ghost" onclick="listRepoFiles()"><i class="fas fa-rotate"></i> Refresh List</button></div><span id="pageStatus" class="ok"></span></div>

<div id="tab-self" class="hidden"><h3><i class="fas fa-code-compare"></i> Self Update Admin</h3><textarea id="selfEditor" style="min-height:420px;font-family:Consolas,monospace;font-size:.8rem;background:#0F172A;color:#E2E8F0"></textarea><div class="grid-2"><button class="btn-ghost" onclick="loadSelf()"><i class="fas fa-download"></i> Load Current Admin</button><button class="btn-accent" onclick="saveSelf()"><i class="fas fa-rocket"></i> Update Myself</button></div><span id="selfStatus" class="ok"></span></div>
</div>

<script>
let GH={owner:localStorage.getItem('gh_owner')||'fosnalictechs',repo:localStorage.getItem('gh_repo')||'fosnalic',branch:localStorage.getItem('gh_branch')||'main',token:localStorage.getItem('gh_token')||''};
let GIST_ID=localStorage.getItem('fos_gist_id')||"0f719dd44c5c9bce109b0bce767f9162";
let CACHE=null;let currentPage='index.html';let currentSha=null;let selfSha=null;
document.getElementById('ghOwner').value=GH.owner;document.getElementById('ghRepo').value=GH.repo;document.getElementById('ghBranch').value=GH.branch;document.getElementById('ghToken').value=GH.token;
document.getElementById('gistIdShort').textContent=GIST_ID.substring(0,12)+'...';
function showTab(id,el){document.querySelectorAll('[id^=tab-]').forEach(d=>d.classList.add('hidden'));document.getElementById('tab-'+id).classList.remove('hidden');document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));if(el)el.classList.add('active');if(id==='pages')listRepoFiles();}
function saveConfig(){GH.owner=document.getElementById('ghOwner').value.trim();GH.repo=document.getElementById('ghRepo').value.trim();GH.branch=document.getElementById('ghBranch').value.trim();GH.token=document.getElementById('ghToken').value.trim();localStorage.setItem('gh_owner',GH.owner);localStorage.setItem('gh_repo',GH.repo);localStorage.setItem('gh_branch',GH.branch);localStorage.setItem('gh_token',GH.token);document.getElementById('cfgOk').textContent='✅ Saved - Connecting...';document.getElementById('gistIdShort').textContent=GIST_ID.substring(0,12)+'...';loadData();listRepoFiles();}
async function getFileSha(p){let r=await fetch(`https://api.github.com/repos/${GH.owner}/${GH.repo}/contents/${p}?ref=${GH.branch}&t=${Date.now()}`,{headers:{Authorization:`token ${GH.token}`},cache:"no-store"});if(!r.ok){if(r.status===404)return{sha:null,content:null,notfound:true};return null;}let j=await r.json();try{let bin=atob(j.content.replace(/\n/g,''));let bytes=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);return{sha:j.sha,content:new TextDecoder().decode(bytes)}}catch(e){return{sha:j.sha,content:''}}}
async function listRepoFiles(){
 document.getElementById('pageButtons').innerHTML='<i class="fas fa-spinner fa-spin"></i> Loading files from GitHub...';
 document.getElementById('repoName').textContent=GH.owner+'/'+GH.repo;
 let r=await fetch(`https://api.github.com/repos/${GH.owner}/${GH.repo}/contents?ref=${GH.branch}&t=${Date.now()}`,{headers:{Authorization:`token ${GH.token}`},cache:"no-store"});
 if(!r.ok){document.getElementById('pageButtons').innerHTML='❌ Cannot list - check token has repo access';return;}
 let files=await r.json();
 let htmls=files.filter(f=>f.type==='file' && f.name.toLowerCase().endsWith('.html')).sort((a,b)=>a.name.localeCompare(b.name));
 document.getElementById('fileCount').textContent=htmls.length; document.getElementById('fileCount2').textContent=htmls.length;
 document.getElementById('pageButtons').innerHTML=htmls.map((f,i)=>`<button class="file-btn ${f.name===currentPage?'active':''}" onclick="loadPage('${f.name}',this)"><i class="fas fa-file"></i> ${f.name}</button>`).join('')||'<i>No HTML files found - create one</i>';
 if(htmls.length && !document.getElementById('pageEditor').value) loadPage(htmls[0].name,document.querySelector('.file-btn'));
}
async function loadPage(n,b){currentPage=n;document.querySelectorAll('.file-btn').forEach(x=>x.classList.remove('active'));if(b)b.classList.add('active');document.getElementById('pageStatus').textContent='Loading '+n+'...';let d=await getFileSha(n);if(d&&d.content!==null){currentSha=d.sha;document.getElementById('pageEditor').value=d.content;document.getElementById('pageStatus').textContent='✅ Loaded '+n+' ('+d.content.length+' chars)';}else{currentSha=null;document.getElementById('pageStatus').textContent='New file';}}
async function createPage(){let name=document.getElementById('newPageName').value.trim();if(!name.endsWith('.html'))name+='.html';currentPage=name;document.getElementById('pageEditor').value=`<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>${name.replace('.html','')} - FOSNALIC Techs</title><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"><style>body{font-family:Segoe UI;background:#0a0e1a;color:#fff;padding:20px}</style></head><body><h1>${name}</h1><p>Professional page for FOSNALIC Techs</p></body></html>`;document.getElementById('pageStatus').textContent='Ready - click SAVE';currentSha=null;}
async function savePageToGitHub(){if(!GH.token)return alert('Paste token');document.getElementById('pageStatus').textContent='Saving '+currentPage+'...';let latest=await getFileSha(currentPage);if(latest&&latest.sha)currentSha=latest.sha;let c=document.getElementById('pageEditor').value;let b64=btoa(new TextEncoder().encode(c).reduce((d,b)=>d+String.fromCharCode(b),''));let body={message:`Update ${currentPage} - professional`,content:b64,branch:GH.branch};if(currentSha)body.sha=currentSha;let r=await fetch(`https://api.github.com/repos/${GH.owner}/${GH.repo}/contents/${currentPage}`,{method:'PUT',headers:{Authorization:`token ${GH.token}`,'Content-Type':'application/json'},body:JSON.stringify(body)});let j=await r.json();if(r.ok){currentSha=j.content.sha;document.getElementById('pageStatus').textContent='✅ Saved '+currentPage;listRepoFiles();}else{document.getElementById('pageStatus').textContent='❌ '+j.message;if(j.message.includes('sha')){currentSha=null;setTimeout(savePageToGitHub,600);}}}
async function loadSelf(){let d=await getFileSha('admin.html');if(d&&d.content){selfSha=d.sha;document.getElementById('selfEditor').value=d.content;document.getElementById('selfStatus').textContent='✅ Loaded';}}
async function saveSelf(){let latest=await getFileSha('admin.html');if(latest)selfSha=latest.sha;let c=document.getElementById('selfEditor').value;let b64=btoa(new TextEncoder().encode(c).reduce((d,b)=>d+String.fromCharCode(b),''));let body={message:'Self-update admin V5 professional',content:b64,branch:GH.branch};if(selfSha)body.sha=selfSha;let r=await fetch(`https://api.github.com/repos/${GH.owner}/${GH.repo}/contents/admin.html`,{method:'PUT',headers:{Authorization:`token ${GH.token}`,'Content-Type':'application/json'},body:JSON.stringify(body)});let j=await r.json();if(r.ok){selfSha=j.content.sha;document.getElementById('selfStatus').textContent='✅ SELF-UPDATED!';}else{document.getElementById('selfStatus').textContent='❌ '+j.message;}}
async function createNewGist(){let init={ticker:["Welcome to FOSNALIC Techs - Professional ICT Solutions"],ads:[],news:[],apps:[],adHeader:{text:""},adMiddle:{text:""},adFooter:{text:""}};let r=await fetch('https://api.github.com/gists',{method:'POST',headers:{Authorization:`token ${GH.token}`,'Content-Type':'application/json'},body:JSON.stringify({description:"fosnalic-data",public:true,files:{'fosnalic-data.json':{content:JSON.stringify(init,null,2)}}})});let j=await r.json();GIST_ID=j.id;localStorage.setItem('fos_gist_id',GIST_ID);return j;}
async function loadData(){try{let r=await fetch(`https://api.github.com/gists/${GIST_ID}?t=${Date.now()}`,{headers:{Authorization:`token ${GH.token}`}});if(!r.ok){if(r.status===404){await createNewGist();return loadData();}return;}let j=await r.json();CACHE=j.files&&j.files['fosnalic-data.json']?JSON.parse(j.files['fosnalic-data.json'].content):{ticker:[],ads:[],news:[]};CACHE.ticker=CACHE.ticker||[];CACHE.ads=CACHE.ads||[];CACHE.news=CACHE.news||[];CACHE.adHeader=CACHE.adHeader||{text:""};CACHE.adMiddle=CACHE.adMiddle||{text:""};CACHE.adFooter=CACHE.adFooter||{text:""};document.getElementById('cfgOk').textContent='✅ Connected - Gist OK';document.getElementById('statAds').textContent=CACHE.ads.length;document.getElementById('statNews').textContent=CACHE.news.length;renderTicker();renderAds();renderNews();}catch(e){document.getElementById('cfgErr').textContent='Load fail';}}
async function saveToGist(){let body=JSON.stringify({files:{'fosnalic-data.json':{content:JSON.stringify(CACHE,null,2)}}});let r=await fetch(`https://api.github.com/gists/${GIST_ID}`,{method:'PATCH',headers:{Authorization:`token ${GH.token}`,'Content-Type':'application/json'},body});if(!r.ok&&r.status===404){await createNewGist();return saveToGist();}return r.ok;}
function renderTicker(){document.getElementById('tickerList').innerHTML=CACHE.ticker.map((x,i)=>`<div class="item-row"><span>${x}</span><button class="btn-danger" style="padding:4px 10px" onclick="removeTicker(${i})"><i class="fas fa-xmark"></i></button></div>`).join('')||'<i style="color:#64748B">No ticker - add one</i>';}
async function addTicker(){let v=document.getElementById('tickerInput').value.trim();if(!v)return;CACHE.ticker.push(v);document.getElementById('tickerInput').value='';await saveToGist();renderTicker();}
async function removeTicker(i){CACHE.ticker.splice(i,1);await saveToGist();renderTicker();}
async function fixTickerNow(){CACHE.ticker=CACHE.ticker.filter(t=>!t.toLowerCase().includes('2.5m')&&!t.toLowerCase().includes('get now'));CACHE.adHeader={text:""};CACHE.adMiddle={text:""};CACHE.adFooter={text:""};CACHE.ads=[];if(CACHE.ticker.length===0)CACHE.ticker=["Welcome to FOSNALIC Techs - Professional ICT Solutions"];await saveToGist();renderTicker();renderAds();alert('✅ Cleaned - marquee will move');}
function renderAds(){let hasH=CACHE.adHeader.text?'<span class="badge badge-warn">Header HAS</span>':'<span class="badge badge-ok">Header Empty</span>';let hasM=CACHE.adMiddle.text?'<span class="badge badge-warn">Middle HAS</span>':'<span class="badge badge-ok">Middle Empty</span>';document.getElementById('bannerStatus').innerHTML=`${hasH} ${hasM} <span class="badge" style="background:#EEF2FF">ads[] ${CACHE.ads.length}</span>`;document.getElementById('statAds').textContent=CACHE.ads.length;document.getElementById('adsList').innerHTML=CACHE.ads.map((a,i)=>`<div class="item-row"><span><b>${a.type}</b> ${a.slot} ${a.showOnce?'<span class="badge badge-ok">ONCE</span>':''}</span><button class="btn-danger" style="padding:4px 10px" onclick="CACHE.ads.splice(${i},1);saveToGist();renderAds()"><i class="fas fa-trash"></i></button></div><div style="font-size:.8rem;color:#64748B;padding:0 10px 8px">${a.html.substring(0,100)}</div>`).join('')||'<div style="color:#64748B;padding:10px"><i>No ads - your site is clean</i></div>';}
async function saveAd(){let ad={id:Date.now(),type:document.getElementById('adType').value,slot:document.getElementById('adSlot').value,html:document.getElementById('adText').value,closable:document.getElementById('adClosable').checked,enabled:document.getElementById('adEnabled').checked,showOnce:document.getElementById('adShowOnce').checked};if(!ad.html)return alert('Add HTML');CACHE.ads.push(ad);if(ad.type==='banner')CACHE[ad.slot]={text:ad.html};await saveToGist();renderAds();document.getElementById('adText').value='';}
async function clearAllBanners(){if(!confirm('Clear ALL ads and banner slots?'))return;CACHE.ads=[];CACHE.adHeader={text:""};CACHE.adMiddle={text:""};CACHE.adFooter={text:""};await saveToGist();renderAds();alert('✅ All cleared - refresh index.html');}
function clearSeen(){localStorage.removeItem('fos_ads_seen');alert('✅ Popup views reset - popups will show once again');}
function renderNews(){document.getElementById('statNews').textContent=CACHE.news.length;document.getElementById('newsList').innerHTML=CACHE.news.slice().reverse().map((n,i)=>`<div class="item-row"><span><b>${n.title}</b> <small style="color:#64748B">${n.tag||''}</small></span><button class="btn-danger" style="padding:4px 10px" onclick="CACHE.news.splice(${CACHE.news.length-1-i},1);saveToGist();renderNews()"><i class="fas fa-trash"></i></button></div>`).join('')||'<i style="color:#64748B">No updates yet</i>';}
async function saveNews(){let n={title:document.getElementById('newsTitle').value,desc:document.getElementById('newsDesc').value,tag:document.getElementById('newsTag').value,img:document.getElementById('newsImg').value,date:new Date().toISOString()};if(!n.title)return alert('Title required');CACHE.news.push(n);await saveToGist();renderNews();document.getElementById('newsTitle').value='';document.getElementById('newsDesc').value='';}
async function uploadImage(){let file=document.getElementById('newsFile').files[0];if(!file)return alert('Choose file');let reader=new FileReader();reader.onload=async function(){let b64=reader.result.split(',')[1];let path=`uploads/${Date.now()}_${file.name.replace(/\s/g,'_')}`;let r=await fetch(`https://api.github.com/repos/${GH.owner}/${GH.repo}/contents/${path}`,{method:'PUT',headers:{Authorization:`token ${GH.token}`,'Content-Type':'application/json'},body:JSON.stringify({message:`Upload ${path}`,content:b64,branch:GH.branch})});let j=await r.json();if(r.ok){let url=`https://raw.githubusercontent.com/${GH.owner}/${GH.repo}/${GH.branch}/${path}`;document.getElementById('newsImg').value=url;document.getElementById('newsUploadStatus').textContent='✅ Uploaded';}else alert(j.message);};reader.readAsDataURL(file);}
loadData();
</script></body></html>
