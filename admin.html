<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin V4.9 Auto List</title>
<style>body{font-family:Segoe UI;background:#F5F7FA;padding:12px}.card{background:#fff;padding:16px;border-radius:14px;margin:0 auto 16px;max-width:1150px;box-shadow:0 8px 20px rgba(0,0,0,.06)}input,textarea,select{width:100%;padding:10px;border:1px solid #E2E8F0;border-radius:8px;margin:5px 0}button{padding:10px 14px;background:#2A4B7C;color:#fff;border:none;border-radius:8px;cursor:pointer;font-weight:600}.ok{color:#16A34A;font-size:.85rem}.err{color:#E53E3E}.tab{padding:8px 14px;background:#eee;border-radius:8px;cursor:pointer;margin:3px;display:inline-block}.tab.active{background:#2A4B7C;color:#fff}.hidden{display:none}.file-btn{padding:6px 12px;background:#fff;border:1px solid #E2E8F0;border-radius:8px;margin:3px;cursor:pointer}.file-btn.active{background:#2A4B7C;color:#fff}</style></head><body>
<h2 style="max-width:1150px;margin:0 auto 12px">Admin V4.9 - Auto Lists All Pages ✅</h2>
<div class="card" style="border:2px solid #2A4B7C"><h3>⚙️ GitHub Connection</h3><div style="display:grid;grid-template-columns:1fr 1fr;gap:10px"><input id="ghOwner" value="fosnalictechs"><input id="ghRepo" value="fosnalic"></div><div style="display:grid;grid-template-columns:1fr 1fr;gap:10px"><input id="ghBranch" value="main"><input id="ghToken" type="password" placeholder="ghp_ token"></div><button onclick="saveConfig()">Save Config + List Pages</button> <span id="cfgOk" class="ok"></span> <span id="cfgErr" class="err"></span></div>
<div class="card"><div><span class="tab active" onclick="showTab('ticker',this)">📢 Ticker</span><span class="tab" onclick="showTab('ads',this)">🎯 Ads</span><span class="tab" onclick="showTab('news',this)">📰 Updates</span><span class="tab" onclick="showTab('pages',this)">📝 Pages</span></div>
<div id="tab-ticker"><h3>📢 Ticker</h3><div style="display:flex;gap:8px"><input id="tickerInput" placeholder="Ticker"><button onclick="addTicker()">Add</button></div><div id="tickerList"></div><button onclick="fixTickerNow()" style="background:#111;width:100%;margin-top:8px">🧹 Fix Marquee</button></div>
<div id="tab-ads" class="hidden"><h3>🎯 Ads</h3><select id="adType"><option value="floating-br">Floating BR</option><option value="floating-bl">Floating BL</option><option value="banner">Banner</option><option value="sticky-bottom">Sticky Bottom</option><option value="top-bar">Top Bar</option><option value="fullscreen">Fullscreen Popup</option></select><select id="adSlot"><option value="floating">Floating</option><option value="adHeader">Header</option><option value="adMiddle">Middle</option><option value="adFooter">Footer</option></select><textarea id="adText" style="min-height:90px"></textarea><button onclick="saveAd()" style="background:#8b5cf6;width:100%">Save Ad</button><button onclick="clearAllBanners()" style="background:#111;width:100%;margin-top:8px">🧹 CLEAR ALL</button><div id="bannerStatus"></div><div id="adsList"></div></div>
<div id="tab-news" class="hidden"><h3>📰 Updates</h3><input id="newsTitle" placeholder="Title"><textarea id="newsDesc" placeholder="Desc"></textarea><input id="newsImg" placeholder="Image URL"><button onclick="saveNews()" style="background:#111;width:100%">Save Update</button><div id="newsList"></div></div>
<div id="tab-pages" class="hidden"><h3>📝 Pages - Real Files From GitHub</h3><div style="padding:10px;background:#E0F2FE;border-radius:8px;margin-bottom:10px;font-size:.85rem">Files found in repo <b id="repoName">fosnalictechs/fosnalic</b>: <span id="fileCount"></span></div><div style="display:flex;flex-wrap:wrap;gap:4px" id="pageButtons">Loading...</div><div style="margin-top:10px"><input id="newPageName" placeholder="new-page.html"><button onclick="createPage()" style="background:#22c55e">+ Create New Page</button></div><textarea id="pageEditor" style="min-height:500px;font-family:monospace;font-size:.82rem;margin-top:10px"></textarea><button onclick="savePageToGitHub()" style="background:#111;width:100%;margin-top:8px">💾 SAVE</button><span id="pageStatus" class="ok"></span></div>
</div>
<script>
let GH={owner:localStorage.getItem('gh_owner')||'fosnalictechs',repo:localStorage.getItem('gh_repo')||'fosnalic',branch:localStorage.getItem('gh_branch')||'main',token:localStorage.getItem('gh_token')||''};
let GIST_ID=localStorage.getItem('fos_gist_id')||"0f719dd44c5c9bce109b0bce767f9162";
let CACHE=null;let currentPage='index.html';let currentSha=null;
document.getElementById('ghOwner').value=GH.owner;document.getElementById('ghRepo').value=GH.repo;document.getElementById('ghBranch').value=GH.branch;document.getElementById('ghToken').value=GH.token;
function showTab(id,el){document.querySelectorAll('[id^=tab-]').forEach(d=>d.classList.add('hidden'));document.getElementById('tab-'+id).classList.remove('hidden');document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));if(el)el.classList.add('active');}
function saveConfig(){GH.owner=document.getElementById('ghOwner').value.trim();GH.repo=document.getElementById('ghRepo').value.trim();GH.branch=document.getElementById('ghBranch').value.trim();GH.token=document.getElementById('ghToken').value.trim();localStorage.setItem('gh_owner',GH.owner);localStorage.setItem('gh_repo',GH.repo);localStorage.setItem('gh_branch',GH.branch);localStorage.setItem('gh_token',GH.token);document.getElementById('cfgOk').textContent='Saved';loadData();listRepoFiles();}
async function getFileSha(p){let r=await fetch(`https://api.github.com/repos/${GH.owner}/${GH.repo}/contents/${p}?ref=${GH.branch}&t=${Date.now()}`,{headers:{Authorization:`token ${GH.token}`},cache:"no-store"});if(!r.ok){if(r.status===404)return{sha:null,content:null,notfound:true};return null;}let j=await r.json();try{let b=atob(j.content.replace(/\n/g,''));return{sha:j.sha,content:new TextDecoder().decode(Uint8Array.from(b,(c)=>c.charCodeAt(0)))} }catch(e){try{let binary=atob(j.content.replace(/\n/g,''));let bytes=new Uint8Array(binary.length);for(let i=0;i<binary.length;i++)bytes[i]=binary.charCodeAt(i);return{sha:j.sha,content:new TextDecoder().decode(bytes)}}catch(e2){return{sha:j.sha,content:j.content}}}}
async function listRepoFiles(){
 document.getElementById('pageButtons').innerHTML='Loading files...';
 document.getElementById('repoName').textContent=GH.owner+'/'+GH.repo;
 let r=await fetch(`https://api.github.com/repos/${GH.owner}/${GH.repo}/contents?ref=${GH.branch}&t=${Date.now()}`,{headers:{Authorization:`token ${GH.token}`},cache:"no-store"});
 if(!r.ok){document.getElementById('pageButtons').innerHTML='❌ Cannot list: '+(await r.text()).substring(0,200);return;}
 let files=await r.json();
 let htmls=files.filter(f=>f.type==='file' && f.name.endsWith('.html'));
 document.getElementById('fileCount').textContent=htmls.length+' html files';
 document.getElementById('pageButtons').innerHTML=htmls.map((f,i)=>`<button class="file-btn ${i==0?'active':''}" onclick="loadPage('${f.name}',this)">${f.name}</button>`).join('');
 if(htmls.length)loadPage(htmls[0].name,document.querySelector('.file-btn'));
 if(htmls.length===0||!htmls.find(f=>f.name==='contact.html')){
   document.getElementById('pageButtons').innerHTML+=`<div style="width:100%;margin-top:10px;padding:8px;background:#FEF3C7;border-radius:6px;font-size:.85rem">⚠️ contact.html, services.html NOT FOUND in root - Click + Create to make them</div>`;
 }
}
async function loadPage(n,b){currentPage=n;document.querySelectorAll('.file-btn').forEach(x=>x.classList.remove('active'));if(b)b.classList.add('active');document.getElementById('pageStatus').textContent='Loading '+n+'...';let d=await getFileSha(n);if(d&&d.content!==null){currentSha=d.sha;document.getElementById('pageEditor').value=d.content;document.getElementById('pageStatus').textContent='✅ Loaded '+n+' ('+d.content.length+' chars)';}else{document.getElementById('pageEditor').value='';currentSha=null;document.getElementById('pageStatus').textContent='New file';}}
async function createPage(){let name=document.getElementById('newPageName').value.trim();if(!name)return alert('Enter name like contact.html');currentPage=name;document.getElementById('pageEditor').value=`<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>${name}</title></head><body><h1>${name}</h1><p>New page</p></body></html>`;document.getElementById('pageStatus').textContent='New page ready - click SAVE';currentSha=null;}
async function savePageToGitHub(){if(!GH.token)return alert('Paste token');let latest=await getFileSha(currentPage);if(latest&&latest.sha)currentSha=latest.sha;let c=document.getElementById('pageEditor').value;let bytes=new TextEncoder().encode(c);let binary='';bytes.forEach(b=>binary+=String.fromCharCode(b));let b64=btoa(binary);let body={message:`Update ${currentPage}`,content:b64,branch:GH.branch};if(currentSha)body.sha=currentSha;let r=await fetch(`https://api.github.com/repos/${GH.owner}/${GH.repo}/contents/${currentPage}`,{method:'PUT',headers:{Authorization:`token ${GH.token}`,'Content-Type':'application/json'},body:JSON.stringify(body)});let j=await r.json();if(r.ok){currentSha=j.content.sha;document.getElementById('pageStatus').textContent='✅ Saved!';listRepoFiles();}else{document.getElementById('pageStatus').textContent='❌ '+j.message;}}
async function createNewGist(){let init={ticker:["Welcome to FOSNALIC Techs"],ads:[],news:[],apps:[],adHeader:{text:""},adMiddle:{text:""},adFooter:{text:""}};let r=await fetch('https://api.github.com/gists',{method:'POST',headers:{Authorization:`token ${GH.token}`,'Content-Type':'application/json'},body:JSON.stringify({description:"fosnalic-data",public:true,files:{'fosnalic-data.json':{content:JSON.stringify(init,null,2)}}})});let j=await r.json();GIST_ID=j.id;localStorage.setItem('fos_gist_id',GIST_ID);return j;}
async function loadData(){try{let r=await fetch(`https://api.github.com/gists/${GIST_ID}?t=${Date.now()}`,{headers:{Authorization:`token ${GH.token}`}});if(!r.ok){if(r.status===404){await createNewGist();return loadData();}return;}let j=await r.json();CACHE=j.files['fosnalic-data.json']?JSON.parse(j.files['fosnalic-data.json'].content):{ticker:[],ads:[],news:[]};CACHE.ticker=CACHE.ticker||[];CACHE.ads=CACHE.ads||[];CACHE.news=CACHE.news||[];CACHE.adHeader=CACHE.adHeader||{text:""};CACHE.adMiddle=CACHE.adMiddle||{text:""};CACHE.adFooter=CACHE.adFooter||{text:""};document.getElementById('cfgOk').textContent='✅ Gist OK';renderTicker();renderAds();renderNews();}catch(e){}}
async function saveToGist(){let body=JSON.stringify({files:{'fosnalic-data.json':{content:JSON.stringify(CACHE,null,2)}}});let r=await fetch(`https://api.github.com/gists/${GIST_ID}`,{method:'PATCH',headers:{Authorization:`token ${GH.token}`,'Content-Type':'application/json'},body});if(!r.ok&&r.status===404){await createNewGist();return saveToGist();}return r.ok;}
function renderTicker(){document.getElementById('tickerList').innerHTML=CACHE.ticker.map((x,i)=>`<div style="display:flex;justify-content:space-between;padding:5px;border-bottom:1px solid #eee">${x}<button onclick="removeTicker(${i})" style="background:red;padding:2px 8px">X</button></div>`).join('')||'<i>None</i>';}
async function addTicker(){let v=document.getElementById('tickerInput').value.trim();if(!v)return;CACHE.ticker.push(v);document.getElementById('tickerInput').value='';await saveToGist();renderTicker();}
async function removeTicker(i){CACHE.ticker.splice(i,1);await saveToGist();renderTicker();}
async function fixTickerNow(){CACHE.ticker=CACHE.ticker.filter(t=>!t.includes('2.5M')&&!t.includes('Get Now'));CACHE.adHeader={text:""};CACHE.adMiddle={text:""};CACHE.adFooter={text:""};CACHE.ads=[];if(CACHE.ticker.length==0)CACHE.ticker=["Welcome to FOSNALIC Techs"];await saveToGist();renderTicker();renderAds();}
function renderAds(){document.getElementById('bannerStatus').innerHTML=`ads:${CACHE.ads.length}`;document.getElementById('adsList').innerHTML=CACHE.ads.map((a,i)=>`<div style="border:1px solid #ddd;padding:6px;margin:5px 0">${a.type} <button onclick="CACHE.ads.splice(${i},1);saveToGist();renderAds()" style="float:right;background:red">Del</button></div>`).join('')||'<i>No ads</i>';}
async function saveAd(){let ad={id:Date.now(),type:document.getElementById('adType').value,slot:document.getElementById('adSlot').value,html:document.getElementById('adText').value,enabled:true,showOnce:true};if(!ad.html)return alert('Add HTML');CACHE.ads.push(ad);if(ad.type==='banner')CACHE[ad.slot]={text:ad.html};await saveToGist();renderAds();}
async function clearAllBanners(){CACHE.ads=[];CACHE.adHeader={text:""};CACHE.adMiddle={text:""};CACHE.adFooter={text:""};await saveToGist();renderAds();alert('✅ CLEARED');}
function renderNews(){document.getElementById('newsList').innerHTML=CACHE.news.slice().reverse().map((n,i)=>`<div style="padding:6px;border:1px solid #eee;margin:4px 0"><b>${n.title}</b> <button onclick="CACHE.news.splice(${CACHE.news.length-1-i},1);saveToGist();renderNews()" style="background:red">Del</button></div>`).join('')||'<i>No news</i>';}
async function saveNews(){let n={title:document.getElementById('newsTitle').value,desc:document.getElementById('newsDesc').value,img:document.getElementById('newsImg').value,date:new Date().toISOString()};if(!n.title)return alert('Title');CACHE.news.push(n);await saveToGist();renderNews();}
loadData();listRepoFiles();
</script></body></html>
