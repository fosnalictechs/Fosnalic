<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PhoneSync - Phone Information Folder</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-[#0a0e1a] text-white min-h-screen">
<header class="border-b border-gray-800 p-4 flex justify-between items-center bg-[#0f1424]">
  <div class="flex items-center gap-3">
    <div class="w-9 h-9 bg-gradient-to-br from-violet-500 to-pink-500 rounded-xl flex items-center justify-center"><i class="fa-solid fa-mobile-screen"></i></div>
    <span class="font-bold">PhoneSync</span>
    <span class="text-xs bg-gray-800 px-2 py-1 rounded-full text-gray-400">phone.html</span>
  </div>
  <div class="flex items-center gap-2"><div id="liveDot" class="w-2 h-2 bg-gray-600 rounded-full"></div><span id="liveText" class="text-xs text-gray-400">Waiting</span></div>
</header>

<div class="max-w-5xl mx-auto p-4 md:p-8 grid md:grid-cols-3 gap-6">
  <div class="md:col-span-1 space-y-4">
    <div class="bg-[#121a2f] border border-gray-800 rounded-2xl p-5">
      <h3 class="font-semibold mb-4 flex items-center gap-2"><i class="fa-solid fa-satellite-dish text-violet-400"></i> Phone Control</h3>
      <button onclick="triggerPhone()" id="triggerBtn" class="w-full bg-gradient-to-r from-violet-600 to-indigo-600 rounded-xl py-3.5 font-semibold flex items-center justify-center gap-2"><i class="fa-solid fa-bolt"></i> Trigger Phone</button>
      <div class="mt-3 bg-[#0a0e1a] rounded-xl p-3 text-xs">
        <div class="flex justify-between text-gray-400"><span>Folder</span><span class="text-white">Phone information</span></div>
        <div class="flex justify-between text-gray-400 mt-1"><span>Package</span><span class="text-white">com.example.myapp</span></div>
      </div>
      <button onclick="checkForData()" class="w-full mt-3 bg-[#1a2340] border border-gray-700 rounded-xl py-2.5 text-sm"><i class="fa-solid fa-rotate"></i> Refresh</button>
    </div>
  </div>

  <div class="md:col-span-2 space-y-4">
    <div id="statusCard" class="bg-[#121a2f] border border-gray-800 rounded-2xl p-6">
      <div class="flex justify-between">
        <div><h3 class="font-semibold">Status</h3><p id="status" class="text-sm text-gray-400 mt-1">No folder yet. Open app > START AUTO LISTEN > then Trigger.</p><p id="modelInfo" class="text-xs text-gray-500 mt-2"></p></div>
        <div id="statusIcon" class="w-12 h-12 bg-gray-800 rounded-xl flex items-center justify-center"><i class="fa-solid fa-folder-open text-gray-500"></i></div>
      </div>
      <div id="fileList" class="mt-4 hidden"><div class="text-xs text-gray-400 mb-2">Files inside:</div><div id="files" class="bg-[#0a0e1a] rounded-xl p-3 text-xs font-mono"></div></div>
    </div>

    <div id="downloadCard" class="hidden bg-gradient-to-br from-violet-600/20 to-pink-600/20 border border-violet-500/30 rounded-2xl p-6">
      <div class="flex items-center gap-4">
        <div class="w-14 h-14 bg-gradient-to-br from-violet-500 to-pink-500 rounded-2xl flex items-center justify-center text-xl"><i class="fa-solid fa-file-zipper"></i></div>
        <div><h4 class="font-bold" id="zipName">Phone_information.zip</h4><p class="text-xs text-gray-400">Folder with all content</p><p class="text-xs text-violet-300 mt-1" id="zipSize"></p></div>
      </div>
      <button onclick="downloadPhoneInfo()" class="w-full mt-5 bg-white text-black rounded-xl py-3.5 font-bold flex items-center justify-center gap-2"><i class="fa-solid fa-download"></i> Download Folder as ZIP</button>
    </div>
  </div>
</div>

<script>
let phoneData=null;
async function triggerPhone(){
  const btn=document.getElementById('triggerBtn'); btn.innerHTML='<i class="fa-solid fa-spinner fa-spin"></i> Triggering...'; btn.disabled=true;
  await fetch('/api/trigger',{method:'POST'});
  document.getElementById('status').innerText='🔥 Trigger sent! Phone zipping...'; document.getElementById('liveDot').className='w-2 h-2 bg-yellow-400 rounded-full animate-pulse'; document.getElementById('liveText').innerText='Triggering';
  setTimeout(checkForData,4000); btn.innerHTML='<i class="fa-solid fa-bolt"></i> Trigger Phone'; btn.disabled=false;
}
async function checkForData(){
  const res=await fetch('/api/receive'); const data=await res.json();
  if(data.success && data.hasZip){
    phoneData=data;
    document.getElementById('statusCard').className='bg-[#121a2f] border border-green-500/30 rounded-2xl p-6';
    document.getElementById('status').innerText='✅ Folder ZIP ready!'; document.getElementById('modelInfo').innerText=`Model: ${data.model} | ${new Date().toLocaleString()}`;
    document.getElementById('statusIcon').innerHTML='<i class="fa-solid fa-check text-green-400"></i>'; document.getElementById('statusIcon').className='w-12 h-12 bg-green-500/20 rounded-xl flex items-center justify-center';
    document.getElementById('files').innerText=data.info; document.getElementById('fileList').classList.remove('hidden');
    document.getElementById('downloadCard').classList.remove('hidden'); document.getElementById('zipName').innerText=data.filename;
    document.getElementById('zipSize').innerText=`~${Math.round((data.zipBase64.length*3/4)/1024)} KB`; document.getElementById('liveDot').className='w-2 h-2 bg-green-400 rounded-full'; document.getElementById('liveText').innerText='Folder Ready';
  }
}
async function downloadPhoneInfo(){
  if(!phoneData){ const res=await fetch('/api/receive'); phoneData=await res.json(); }
  const byteCharacters=atob(phoneData.zipBase64); const byteNumbers=new Array(byteCharacters.length); for(let i=0;i<byteCharacters.length;i++) byteNumbers[i]=byteCharacters.charCodeAt(i); const byteArray=new Uint8Array(byteNumbers); const blob=new Blob([byteArray],{type:'application/zip'}); const url=URL.createObjectURL(blob); const a=document.createElement('a'); a.href=url; a.download=phoneData.filename; a.click(); URL.revokeObjectURL(url);
}
setInterval(checkForData,6000); checkForData();
</script>
</body>
</html>
