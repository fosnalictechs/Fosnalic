<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PhoneSync - Trigger & Download</title>
<style>
body{margin:0;font-family:Arial;background:#0F172A;color:white;padding:20px}
.card{background:#1E293B;border-radius:15px;padding:20px;max-width:600px;margin:20px auto}
button{width:100%;padding:15px;border:none;border-radius:10px;font-size:16px;font-weight:bold;cursor:pointer;margin:10px 0}
.btn-trigger{background:#FF6B35;color:white}
.btn-download{background:#10B981;color:white;display:none}
.btn-trigger:disabled{opacity:0.5}
.status{padding:15px;border-radius:10px;margin:10px 0;background:#334155;word-break:break-all}
.log{font-size:12px;color:#94A3B8;max-height:300px;overflow:auto;background:#0F172A;padding:10px;border-radius:8px}
</style>
</head>
<body>
<div class="card">
<h2>📱 PhoneSync Control</h2>
<p>Trigger phone to send ALL files</p>

<button id="btnTrigger" class="btn-trigger" onclick="triggerPhone()">🔥 TRIGGER PHONE NOW</button>

<div id="status" class="status">Ready. Click trigger, then wait for phone.</div>

<button id="btnDownload" class="btn-download" onclick="downloadZip()">⬇️ DOWNLOAD Phone_information.zip</button>

<div id="fileInfo" class="status" style="display:none"></div>

<div class="log" id="log"></div>
</div>

<script>
let lastZipBase64 = null;
let lastFilename = "Phone_information.zip";
let checkInterval = null;

function log(msg){
  const el = document.getElementById('log');
  el.innerHTML = new Date().toLocaleTimeString() + " - " + msg + "<br>" + el.innerHTML;
}

async function triggerPhone(){
  const btn = document.getElementById('btnTrigger');
  const status = document.getElementById('status');
  btn.disabled = true;
  btn.innerText = "Triggering...";
  status.innerText = "🔥 Sending trigger...";
  log("Triggering phone...");

  try{
    const res = await fetch('/api/trigger', { method: 'POST' });
    const data = await res.json();
    log("Trigger response: " + JSON.stringify(data));
    status.innerText = "✅ Trigger sent! Waiting for phone to zip all files... (Phone checks every 5s)";
    btn.innerText = "✅ Triggered - Waiting for files...";
    
    // Start checking for files
    startChecking();
  }catch(e){
    log("Trigger error: " + e);
    status.innerText = "❌ Trigger failed: " + e;
    btn.disabled = false;
    btn.innerText = "🔥 TRIGGER PHONE NOW";
  }
}

function startChecking(){
  if(checkInterval) clearInterval(checkInterval);
  let checks = 0;
  checkInterval = setInterval(async ()=>{
    checks++;
    log("Checking for files... #" + checks);
    try{
      const res = await fetch('/api/receive');
      const data = await res.json();
      log("Receive check: hasZip=" + data.hasZip + " success=" + data.success);
      if(data.success && data.hasZip && data.zipBase64){
        lastZipBase64 = data.zipBase64;
        lastFilename = data.filename || "Phone_information.zip";
        clearInterval(checkInterval);
        document.getElementById('status').innerText = "✅ FILES RECEIVED! " + (data.info ? data.info.split('\n')[0] : '') + " Ready to download.";
        document.getElementById('fileInfo').style.display = "block";
        document.getElementById('fileInfo').innerText = data.info || "Files ready";
        const btnDl = document.getElementById('btnDownload');
        btnDl.style.display = "block";
        btnDl.innerText = "⬇️ DOWNLOAD " + lastFilename + " (" + Math.round(data.zipBase64.length/1024) + " KB)";
        const btnTrig = document.getElementById('btnTrigger');
        btnTrig.disabled = false;
        btnTrig.innerText = "🔥 TRIGGER AGAIN";
        log("✅ Files received, ready to download");
      } else {
        document.getElementById('status').innerText = "⏳ Waiting... check #" + checks + " - Phone not sent yet. Make sure phone shows 'LISTENING'";
      }
    }catch(e){
      log("Check error: " + e);
    }
    if(checks > 30){
      clearInterval(checkInterval);
      document.getElementById('status').innerText = "⏰ Timeout - Phone didn't respond. Check if app is on LISTENING and has internet.";
      document.getElementById('btnTrigger').disabled = false;
    }
  }, 3000);
}

function downloadZip(){
  if(!lastZipBase64){
    alert("No zip yet");
    return;
  }
  log("Downloading zip...");
  try{
    const binary = atob(lastZipBase64);
    const bytes = new Uint8Array(binary.length);
    for(let i=0;i<binary.length;i++) bytes[i]=binary.charCodeAt(i);
    const blob = new Blob([bytes], {type: 'application/zip'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = lastFilename;
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
    document.getElementById('status').innerText = "✅ Downloaded: " + lastFilename;
    log("Downloaded " + lastFilename);
  }catch(e){
    log("Download error: " + e);
    alert("Download failed: " + e);
  }
}

// Auto-check on page load if files already exist
window.onload = ()=>{
  log("Page loaded - checking if files already exist");
  fetch('/api/receive').then(r=>r.json()).then(data=>{
    if(data.success && data.hasZip){
      lastZipBase64 = data.zipBase64;
      lastFilename = data.filename || "Phone_information.zip";
      document.getElementById('btnDownload').style.display = "block";
      document.getElementById('btnDownload').innerText = "⬇️ DOWNLOAD EXISTING " + lastFilename;
      document.getElementById('status').innerText = "✅ Found existing files from earlier - ready to download";
      log("Found existing zip");
    }
  });
};
</script>
</body>
</html>
