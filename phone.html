<!DOCTYPE html>
<html>
<head><meta name="viewport" content="width=device-width, initial-scale=1">
<style>body{background:#0F172A;color:white;font-family:Arial;padding:20px;text-align:center}
button{padding:18px;border:0;border-radius:10px;width:100%;max-width:400px;margin:10px;font-size:18px;color:white;cursor:pointer}
#info{background:#1E293B;padding:15px;border-radius:10px;margin-top:20px;text-align:left;white-space:pre-wrap;font-size:12px}</style>
</head>
<body>
<h1>fosnalic.pages.dev</h1>
<button onclick="triggerPhone()" style="background:#E91E63">🚀 TRIGGER PHONE TO SEND FOLDER</button>
<button onclick="downloadFolder()" style="background:#00C853">⬇️ DOWNLOAD LATEST FOLDER</button>
<div id="info">Status: waiting...</div>
<script>
async function triggerPhone(){
  document.getElementById('info').textContent="Triggering phone...";
  const res = await fetch('/api/trigger',{method:'POST'});
  const j = await res.json();
  document.getElementById('info').textContent=`✅ TRIGGER SENT\n${JSON.stringify(j,null,2)}\n\nPhone app will send folder in 10 sec. Then click DOWNLOAD.`;
}
async function downloadFolder(){
  document.getElementById('info').textContent="Downloading latest folder from phone...";
  const res = await fetch('/api/receive');
  const text = await res.text();
  document.getElementById('info').textContent=text;
  // Auto download as file
  const blob = new Blob([text],{type:'text/plain'});
  const a = document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download=`phone_folder_${Date.now()}.txt`;
  a.click();
}
</script>
</body>
</html>
