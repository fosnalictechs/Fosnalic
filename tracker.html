<!DOCTYPE html><html><head>
<title>FOSNALIC One-File Tracker</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>body{font-family:sans-serif;padding:15px;background:#f5f7fb}#map{width:100%;height:60vh;border-radius:15px;border:2px solid #1A365D;display:none}.card{background:white;padding:12px;border-radius:12px;margin:10px 0;box-shadow:0 2px 10px #0001}button{background:#1A365D;color:white;padding:14px 20px;border:none;border-radius:10px;font-weight:800;width:100%;margin:6px 0;font-size:16px} .admin{display:none} .tracker{display:none}</style>
</head><body>
<h2>📍 FOSNALIC Tracker - LIVE</h2>

<div id="trackerMode" class="tracker">
<div class="card">
<p><b>Device ID:</b> <span id="myId"></span></p>
<p>Keep this page open. It sends live location to admin.</p>
<p id="status">Not sharing</p>
<p id="coords" style="font-weight:bold"></p>
<button id="startBtn">▶️ START SHARING</button>
<button id="stopBtn" style="background:#c00">⏹️ STOP</button>
<p><small>Interval: <select id="interval"><option value="10000">10 sec</option><option value="30000">30 sec</option><option value="60000" selected>1 min</option><option value="300000">5 mins</option></select> | Allow GPS when asked</small></p>
</div>
<a href="?mode=admin">I am Admin → View Map</a>
</div>

<div id="adminMode" class="admin">
<div id="map"></div>
<div class="card">
<button onclick="loadData()">🔄 REFRESH NOW</button>
<p id="log">Loading devices...</p>
</div>
<div id="devices"></div>
<a href="?mode=track">Go to Tracker Mode (Phone)</a>
</div>

<script>
const STORAGE_URL = "https://api.npoint.io/bab682f56b4dedc1becd";

let deviceId = localStorage.getItem('fos_device') || 'FOS-'+Math.random().toString(36).slice(2,6).toUpperCase();
localStorage.setItem('fos_device', deviceId);
document.getElementById('myId').innerText = deviceId;

let timer = null;
let mode = new URLSearchParams(location.search).get('mode') || 'track';

if(mode === 'admin'){
  document.getElementById('adminMode').style.display='block';
  document.getElementById('map').style.display='block';
  loadGoogleMaps();
} else {
  document.getElementById('trackerMode').style.display='block';
}

async function sendLocation(lat, lng, acc){
  let data = {id:deviceId, lat, lng, acc, time:Date.now()};
  document.getElementById('coords').innerText = `Lat: ${lat} | Lng: ${lng}`;
  try{
    let res = await fetch(STORAGE_URL);
    let all = await res.json();
    if(!Array.isArray(all)) all = all ? Object.values(all).filter(x=>x && x.id) : [];
    all = all.filter(d=>d.id !== deviceId);
    all.push(data);
    await fetch(STORAGE_URL, {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(all)});
    document.getElementById('status').innerText = '✅ Sent at '+new Date().toLocaleTimeString();
  }catch(e){ document.getElementById('status').innerText = '❌ Error: '+e.message; }
}

function startSharing(){
  if(!navigator.geolocation){ alert('No GPS'); return; }
  document.getElementById('status').innerText = 'Starting... allow GPS';
  let interval = parseInt(document.getElementById('interval').value);
  if(timer) clearInterval(timer);
  const doSend = ()=>{ navigator.geolocation.getCurrentPosition(pos=>{
      sendLocation(pos.coords.latitude, pos.coords.longitude, Math.round(pos.coords.accuracy));
    }, err=>{ document.getElementById('status').innerText = 'GPS Error: '+err.message; }, {enableHighAccuracy:true}); };
  doSend();
  timer = setInterval(doSend, interval);
}
function stopSharing(){ if(timer) clearInterval(timer); document.getElementById('status').innerText = 'Stopped'; }

document.getElementById('startBtn').onclick = startSharing;
document.getElementById('stopBtn').onclick = stopSharing;

let map, markers = {};
function loadGoogleMaps(){
  let s = document.createElement('script');
  s.src = `https://maps.googleapis.com/maps/api/js?callback=initMap`;
  s.onerror = ()=>{ document.getElementById('map').innerHTML = '<p>Map preview needs no key. List below works - click Open in Google Maps</p>'; document.getElementById('map').style.display='block'; loadData(); };
  document.head.appendChild(s);
}
function initMap(){
  map = new google.maps.Map(document.getElementById("map"), {zoom:13, center:{lat:0.3476,lng:32.5825}});
  loadData();
  setInterval(loadData, 10000);
}
async function loadData(){
  try{
    let res = await fetch(STORAGE_URL);
    let data = await res.json();
    let list = Array.isArray(data) ? data : Object.values(data);
    document.getElementById('devices').innerHTML = '';
    document.getElementById('log').innerText = 'Last refresh: '+new Date().toLocaleTimeString()+' | Devices: '+list.length;
    list.forEach(loc=>{
      if(!loc || !loc.lat) return;
      if(map){
        let pos = {lat:loc.lat, lng:loc.lng};
        if(!markers[loc.id]) markers[loc.id] = new google.maps.Marker({map, title:loc.id});
        markers[loc.id].setPosition(pos);
        map.setCenter(pos);
      }
      document.getElementById('devices').innerHTML += `<div class="card"><b>${loc.id}</b><br>Lat: ${loc.lat}<br>Lng: ${loc.lng}<br>Accuracy: ${loc.acc || ''}m<br>Time: ${new Date(loc.time).toLocaleString()}<br><a target="_blank" href="https://www.google.com/maps?q=${loc.lat},${loc.lng}" style="color:#1A365D;font-weight:800">📍 Open in Google Maps</a></div>`;
    });
  }catch(e){ document.getElementById('log').innerText = 'Error: '+e.message; }
}
</script>
</body></html>
