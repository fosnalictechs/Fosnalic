<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FOSNALIC Tracker - LIVE</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
body{background:#121212;color:#fff;font-family:sans-serif;margin:0;padding:10px}
#map{height:70vh;width:100%;border-radius:12px}
button{width:100%;padding:15px;background:#1976D2;color:#fff;border:none;border-radius:10px;font-size:18px;font-weight:bold;margin-top:10px}
a{color:#90caf9}
</style>
</head>
<body>
<h2>📍 FOSNALIC Tracker - LIVE (FREE MAP)</h2>
<div id="map"></div>
<button onclick="load()">🔄 REFRESH NOW</button>
<p id="info">Last refresh: -- | Devices: 0</p>
<a href="#" onclick="switchMode()">Go to Tracker Mode (Phone)</a>

<script>
const STORAGE_URL = "https://api.npoint.io/bab682f56b4dedc1becd";
let map = L.map('map').setView([0.3476, 32.5825], 12); // Kampala
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '© OpenStreetMap'
}).addTo(map);
let markers = [];

async function load(){
  try{
    const res = await fetch(STORAGE_URL);
    const data = await res.json();
    markers.forEach(m=>map.removeLayer(m));
    markers=[];
    let count=0;
    data.forEach(d=>{
      if(!d.lat) return;
      const m = L.marker([d.lat, d.lng]).addTo(map)
        .bindPopup(`<b>${d.id}</b><br>Acc: ${d.acc}m<br>${new Date(d.time).toLocaleString()}`);
      markers.push(m);
      count++;
    });
    if(count>0) map.fitBounds(markers.map(m=>m.getLatLng()));
    document.getElementById('info').innerText = `Last refresh: ${new Date().toLocaleTimeString()} | Devices: ${count}`;
  }catch(e){
    document.getElementById('info').innerText = "Error loading - check npoint URL";
  }
}
function switchMode(){
  document.body.innerHTML="<h2>Phone Tracker Mode</h2><p>Install APK and press START TRACKING. Your ID will appear here automatically.</p><button onclick='location.reload()'>Back to Admin</button>";
}
load();
setInterval(load, 30000);
</script>
</body>
</html>
