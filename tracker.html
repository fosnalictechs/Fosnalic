<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FOSNALIC Admin</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
body{margin:0;font-family:sans-serif;background:#111;color:#fff}
#map{height:55vh;width:100%}
.card{background:#1e1e1e;margin:10px;padding:12px;border-radius:12px}
.btn{padding:10px 14px;border:none;border-radius:8px;font-weight:bold;margin:4px}
.btn-blue{background:#1976D2;color:#fff}
.btn-green{background:#2e7d32;color:#fff}
.btn-orange{background:#ef6c00;color:#fff}
</style>
</head>
<body>
<div id="map"></div>
<div style="padding:10px">
<button class="btn btn-blue" onclick="load()">🔄 REFRESH</button>
<span id="status">Loading...</span>
<div id="list"></div>
</div>

<script>
const STORAGE_URL = "https://api.npoint.io/bab682f56b4dedc1becd";
let map = L.map('map').setView([0.3476,32.5825], 12);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OSM'}).addTo(map);
let markers=[];

function openOnline(lat,lng){
  window.open(`https://www.google.com/maps?q=${lat},${lng}`,'_blank');
}
function openOSM(lat,lng){
  window.open(`https://www.openstreetmap.org/?mlat=${lat}&mlon=${lng}#map=16/${lat}/${lng}`,'_blank');
}
function openApp(lat,lng){
  // This opens Google Maps app on Android, Apple Maps on iPhone
  window.location.href = `geo:${lat},${lng}?q=${lat},${lng}`;
}

async function load(){
  try{
    const res = await fetch(STORAGE_URL);
    const data = await res.json();
    markers.forEach(m=>map.removeLayer(m)); markers=[];
    let html="";
    data.forEach(d=>{
      if(!d.lat) return;
      const m = L.marker([d.lat,d.lng]).addTo(map).bindPopup(`<b>${d.id}</b><br>${d.lat},${d.lng}`);
      markers.push(m);
      html+=`<div class="card">
        <b>${d.id}</b> — ${new Date(d.time).toLocaleString()}<br>
        Lat: ${d.lat} Lng: ${d.lng} Acc: ${d.acc}m<br>
        <button class="btn btn-blue" onclick="openOnline(${d.lat},${d.lng})">🌐 Google Maps</button>
        <button class="btn btn-green" onclick="openOSM(${d.lat},${d.lng})">🗺️ OSM Online</button>
        <button class="btn btn-orange" onclick="openApp(${d.lat},${d.lng})">📱 Open in App</button>
      </div>`;
    });
    if(markers.length>0) map.fitBounds(markers.map(m=>m.getLatLng()));
    document.getElementById('list').innerHTML = html || "No devices — click START on phone";
    document.getElementById('status').innerText = `Devices: ${data.length} | Updated: ${new Date().toLocaleTimeString()}`;
  }catch(e){ document.getElementById('status').innerText="Error loading npoint"; }
}
load();
setInterval(load,15000);
</script>
</body>
</html>
