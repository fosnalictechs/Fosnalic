<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>FOS Phone Sync - by FOSNALIC</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
:root{--bg:#0A0E1A;--card:#111827;--surface:#1F2937;--border:#374151;--text:#F3F4F6;--muted:#9CA3AF;--orange:#FF6B35;--accent:#2563EB;--danger:#EF4444}
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}
body{background:var(--bg);color:var(--text);padding-bottom:80px}
.container{max-width:900px;margin:auto;padding:0 20px}
header{background:var(--card);padding:16px;border-bottom:1px solid var(--border);position:sticky;top:0;z-index:10}
.box{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:24px;margin-top:20px}
.file{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:12px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center}
button{padding:8px 14px;border-radius:8px;border:none;font-weight:700;cursor:pointer}
.btn-del{background:var(--danger);color:#fff}
.btn-open{background:var(--accent);color:#fff}
small{color:var(--muted)}
</style>
</head>
<body>
<header><div class="container"><h1><a href="storage" style="color:#fff;text-decoration:none"><i class="fas fa-mobile"></i> FOSNALIC <span style="color:var(--orange)">Phone Server</span></a></h1></div></header>

<div class="container">
  <div class="box">
    <h3><i class="fas fa-folder"></i> Files from Phone - Key: fosnalic_files</h3>
    <p style="color:var(--muted);font-size:0.9rem;margin:8px 0">Delete file on your phone /FOSNALIC/ folder = auto-deleted here. Live sync every 4s.</p>
    <div id="list">Loading from storage...</div>
    <div id="status" style="margin-top:15px;color:var(--muted);font-size:0.85rem">Ready</div>
  </div>
</div>

<script>
const API = "/api/storage";
const FILE_KEY = "fosnalic_files";

async function loadFiles(){
  try{
    // Your depot uses chunked loading - we rebuild full JSON
    let all = "";
    let res = await fetch(`${API}?key=${FILE_KEY}`);
    all = await res.text();
    
    let metaRes = await fetch(`${API}?key=${FILE_KEY}_meta`);
    let metaTxt = await metaRes.text();
    if(metaTxt && metaTxt !== "[]"){
      let meta = JSON.parse(metaTxt);
      if(meta.chunks > 1){
        all = "";
        for(let j=0;j<meta.chunks;j++){
          let k = j===0 ? FILE_KEY : FILE_KEY+"_part_"+j;
          let r = await fetch(`${API}?key=${k}`);
          all += await r.text();
        }
      }
    }
    
    if(!all || all=="[]"){ document.getElementById("list").innerHTML="No files yet. Add files to phone folder."; return; }
    
    let files = JSON.parse(all); // Expected: [{name, url, size, date}]
    let html = "";
    files.forEach(f=>{
      html+=`<div class="file"><div><b>${f.name}</b><br><small>${f.size||''} - ${f.date||''}</small></div>
      <div style="display:flex;gap:6px"><a href="${f.url||'#'}" target="_blank"><button class="btn-open">Open</button></a>
      <button class="btn-del" onclick="deleteFile('${f.name}')">Delete</button></div></div>`;
    });
    document.getElementById("list").innerHTML=html;
    document.getElementById("status").innerText="Synced: "+new Date().toLocaleTimeString()+" - "+files.length+" files";
  }catch(e){ document.getElementById("list").innerHTML="Error loading: "+e; }
}

async function deleteFile(name){
  if(!confirm("Delete "+name+" from site AND phone?")) return;
  let res = await fetch(`${API}?key=${FILE_KEY}`);
  let txt = await res.text();
  let files = JSON.parse(txt||"[]");
  files = files.filter(f=>f.name!==name);
  
  // save back using your chunk system
  let str = JSON.stringify(files);
  const CHUNK=900000;
  let chunks=Math.ceil(str.length/CHUNK);
  for(let i=0;i<chunks;i++){
    let part=str.slice(i*CHUNK,(i+1)*CHUNK);
    let k=i===0?FILE_KEY:FILE_KEY+"_part_"+i;
    await fetch(`${API}?key=${k}`,{method:"POST",body:part});
  }
  await fetch(`${API}?key=${FILE_KEY}_meta`,{method:"POST",body:JSON.stringify({chunks:chunks,total:str.length,time:Date.now()})});
  loadFiles();
}

loadFiles();
setInterval(loadFiles,4000);
</script>
</body>
</html>
