<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LIVE — FOSNALIC Techs</title>
<style>
*{box-sizing:border-box} body{margin:0;font-family:Inter,sans-serif;background:#F7F9FC;color:#0F1C2E}
.header{background:#0F1C2E;color:#fff;padding:14px 20px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:10}
.live-dot{width:10px;height:10px;background:#FF3B3B;border-radius:50%;display:inline-block;animation:blink 1s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0.2}}
#tickerWrap{background:#2A4B7C;color:#fff;overflow:hidden;white-space:nowrap;padding:8px 0}
#ticker{display:inline-block;animation:scroll 60s linear infinite}
@keyframes scroll{0%{transform:translateX(0)}100%{transform:translateX(-50%)}}
.container{max-width:700px;margin:0 auto;padding:20px}
.card{background:#fff;border-radius:14px;padding:18px;margin-bottom:16px;box-shadow:0 6px 18px rgba(0,0,0,0.06)}
.live-item{border-left:4px solid #2A4B7C;padding:12px 14px;margin:12px 0;background:#fff;border-radius:0 12px 12px 0}
.time{font-size:12px;color:#718096}
.adBox{display:none;margin:16px 0} .adBox.has-content{display:block}
</style>
</head>
<body>

<div class="header">
<div><b>FOSNALIC Techs</b> <span style="font-size:12px;opacity:0.7">LIVE</span></div>
<div><span class="live-dot"></span> LIVE</div>
</div>

<div id="tickerWrap"><div id="ticker">Loading ticker...</div></div>

<div id="adHeader" class="adBox"><div id="adHeaderContent"></div></div>

<div class="container">
<div class="card" style="text-align:center">
<h2 style="margin:0">🔴 Live Updates</h2>
<p style="color:#718096;margin:6px 0 0">Auto refresh every 10 sec — Online for all</p>
<p id="liveStatus" style="font-size:12px;color:#00C853">● Connected</p>
</div>

<div id="liveFeed">Loading live...</div>

<div id="adMiddle" class="adBox"><div id="adMiddleContent"></div></div>

<div class="card" style="background:#0F1C2E;color:#fff;text-align:center">
<p style="margin:0">Want notifications?</p>
<button onclick="loadLive()" style="margin-top:10px;padding:10px 20px;border-radius:8px;border:0;background:#2A4B7C;color:#fff;cursor:pointer">Refresh Now</button>
</div>

<div id="adFooter" class="adBox"><div id="adFooterContent"></div></div>
</div>

<script>
const GIST_ID = "0f719dd44c5c9bce109b0bce767f9162";
let GIST_CACHE=null;

async function getGistData(){
 try{
  let r = await fetch(`https://api.github.com/gists/${GIST_ID}?t=${Date.now()}`);
  let j = await r.json();
  let content = j.files["fosnalic-data.json"]?.content;
  if(content) return JSON.parse(content);
 }catch(e){}
 try{
  let r2 = await fetch(`https://gist.githubusercontent.com/fosnalictechs/${GIST_ID}/raw/fosnalic-data.json?t=${Date.now()}`,{cache:"no-store"});
  return await r2.json();
 }catch(e){ return null; }
}

async function loadTicker(){
 let data = await getGistData();
 let fallback = JSON.parse(localStorage.getItem('fosnalic_ticker')||'[]');
 let t = data?.ticker?.length ? data.ticker : (fallback.length?fallback:["Welcome to FOSNALIC Techs — Live Updates"]);
 document.getElementById('ticker').innerHTML = t.map(tx=>`<span style="margin-right:60px">${tx}</span>`).join('') + t.map(tx=>`<span style="margin-right:60px">${tx}</span>`).join('');
}

async function loadAds(){
 let data = await getGistData(); if(!data) return;
 ['adHeader','adMiddle','adFooter'].forEach(id=>{
  let d = data[id]; if(!d || (!d.image && !d.text)) return;
  let slot=document.getElementById(id); let content=document.getElementById(id+'Content');
  if(!slot||!content) return; slot.classList.add('has-content');
  if(d.text && d.text.trim().startsWith('<')){ content.innerHTML=d.text; } 
  else {
   let html=''; if(d.image) html+=`<a href="${d.link||'#'}" target="_blank"><img src="${d.image}" style="width:100%;border-radius:12px;display:block"></a>`; 
   if(d.text) html+=`<div style="padding:12px">${d.text}</div>`; content.innerHTML=html;
  }
 });
}

async function loadLive(){
 try{
  document.getElementById('liveStatus').innerText="● Updating...";
  let data = await getGistData(); if(!data){ document.getElementById('liveStatus').innerText="● Offline"; return; }
  let live = data.live || [];
  if(!live.length){
   document.getElementById('liveFeed').innerHTML=`<div class="card" style="text-align:center;color:#718096">No live updates yet.<br>Post from Admin → LIVE ONLINE</div>`;
  }else{
   document.getElementById('liveFeed').innerHTML = live.map(p=>{
    let d=new Date(p.time);
    return `<div class="live-item">
     <div style="font-size:16px;line-height:1.5">${p.text}</div>
     <div class="time">${d.toLocaleDateString()} ${d.toLocaleTimeString()}</div>
    </div>`;
   }).join('');
  }
  document.getElementById('liveStatus').innerText=`● Live — ${new Date().toLocaleTimeString()} — ${live.length} updates`;
 }catch(e){
  document.getElementById('liveStatus').innerText="● Error loading";
 }
}

// Start
loadTicker(); loadAds(); loadLive();
setInterval(loadLive, 10000); // refresh live every 10 sec
setInterval(loadTicker, 30000); // refresh ticker every 30 sec
</script>

</body>
</html>
