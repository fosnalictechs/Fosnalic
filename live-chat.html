<!DOCTYPE html>
<html><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Live - FOSNALIC DEPOT | Real-Time Community</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<style>
:root{--bg:#F4F7FB;--card:#fff;--ink:#0F1C2E;--muted:#6B7A90;--line:#E6EBF2;--brand:#0F1C2E;--accent:#2563EB;--yellow:#FFC107}
*{box-sizing:border-box} body{margin:0;font-family:Inter,system-ui,Segoe UI,Roboto;background:var(--bg);color:var(--ink)}
.top{position:sticky;top:0;z-index:20;background:rgba(15,28,46,.92);backdrop-filter:blur(12px);color:#fff;padding:10px 14px;display:flex;align-items:center;gap:12px}
.top .logo{width:32px;height:32px;border-radius:50%;background:linear-gradient(#FFCC00,#000);display:grid;place-items:center;font-weight:900}
.box{max-width:780px;margin:auto;padding:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;box-shadow:0 4px 20px rgba(15,28,46,.04);margin-bottom:12px}
.tabs{display:flex;gap:8px;overflow:auto;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}
.tab{padding:9px 16px;border-radius:999px;border:1px solid var(--line);background:#fff;cursor:pointer;font-size:13px;font-weight:600;white-space:nowrap;transition:.2s}
.tab.active{background:var(--ink);color:#fff;border-color:var(--ink)} .tab span{opacity:.7;margin-left:4px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.input{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:#FBFDFF;font-size:14px;outline:none}
.input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(37,99,235,.12)}
.btn{padding:11px 16px;border:0;border-radius:12px;background:var(--ink);color:#fff;font-weight:700;cursor:pointer}
.btn:disabled{opacity:.5}
.btn-sm{padding:7px 12px;border-radius:999px;border:1px solid var(--line);background:#F8FAFF;color:var(--ink);font-size:12px;font-weight:600;cursor:pointer}
.btn-sm:hover{background:#EEF3FF}
.feed{display:flex;flex-direction:column;gap:0}
.msg{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px;margin:10px 0;position:relative}
.msg.pinned{border-color:var(--yellow);background:#FFFCF0}
.msg .meta{display:flex;gap:8px;align-items:center;margin-bottom:6px}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;font-weight:800;font-size:12px}
.replyThread{margin-left:18px;border-left:2px solid #DCE6F5;padding-left:14px;margin-top:10px}
.media{max-width:100%;border-radius:12px;margin-top:10px;display:block}
.audio{width:100%;margin-top:10px}
.actions{display:flex;gap:8px;margin-top:10px}
.badge{display:inline-flex;padding:3px 8px;border-radius:999px;background:#E8F0FF;color:var(--accent);font-size:11px;font-weight:700}
.replyBox{background:#FFF8DB;border:1px dashed #FFD64D;padding:8px 10px;border-radius:10px;margin-bottom:10px;font-size:13px;display:none}
.drop{border:2px dashed #CBD5E1;border-radius:12px;padding:14px;text-align:center;color:var(--muted);cursor:pointer}
.drop.drag{border-color:var(--accent);background:#F0F6FF}
#toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:999px;font-size:13px;display:none;z-index:50}
</style>
</head><body>
<div class="top">
<div class="logo">🇺🇬</div>
<div><b>FOSNALIC DEPOT • LIVE</b><div style="font-size:11px;opacity:.8">Fast reply • Organized threads • Real-time</div></div>
<div style="margin-left:auto" class="badge" id="liveDot">● LIVE <span id="count">0</span></div>
</div>

<div class="box">
<div class="card">
<div class="row" style="justify-content:space-between">
<div class="tabs">
<div class="tab active" onclick="setType('all',this)">All <span id="c-all"></span></div>
<div class="tab" onclick="setType('text',this)">💬 Text <span id="c-text"></span></div>
<div class="tab" onclick="setType('image',this)">🖼 Media <span id="c-image"></span></div>
<div class="tab" onclick="setType('pinned',this)">📌 Pinned</div>
</div>
<select id="sort" onchange="load()" style="padding:8px;border-radius:999px;border:1px solid var(--line)">
<option value="new">Newest first</option><option value="old">Oldest first</option>
</select>
</div>
<div class="row" style="margin-top:12px">
<input id="q" class="input" placeholder="🔍 Search messages, names, threads..." oninput="debounceLoad()" style="flex:1">
</div>
</div>

<div class="card">
<div id="replyInfo" class="replyBox"></div>
<div class="row"><input id="n" class="input" placeholder="Your name (e.g. Possible)" style="flex:1;max-width:220px">
<span id="typing" style="font-size:12px;color:var(--muted);display:none">• someone is typing...</span>
</div>
<textarea id="t" class="input" rows="2" placeholder="Write a message... Type @ to mention, press Enter to post" style="margin-top:8px"></textarea>
<div id="mediaPreview" style="display:none;margin:10px 0"></div>
<div id="dropZone" class="drop" style="margin-top:8px">Drag & drop image/video/audio here or <label style="color:var(--accent);cursor:pointer">browse <input type="file" id="fAll" hidden accept="image/*,video/*,audio/*" onchange="uploadFile(this)"></label></div>
<div class="row" style="margin-top:10px">
<div class="row">
<label class="btn-sm">🖼 Photo<input type="file" accept="image/*" hidden onchange="uploadFile(this)"></label>
<label class="btn-sm">🎥 Video<input type="file" accept="video/*" hidden onchange="uploadFile(this)"></label>
<label class="btn-sm">🎙 Audio<input type="file" accept="audio/*" hidden onchange="uploadFile(this)"></label>
</div>
<button class="btn" style="margin-left:auto;min-width:120px" onclick="post()" id="postBtn">Post • ↵</button>
</div>
<div id="s" style="font-size:12px;color:var(--muted);margin-top:8px"></div>
</div>

<div id="feed" class="feed">Loading live feed...</div>
</div>
<div id="toast"></div>

<script>
const API="/api/storage?key=live_messages";
let replyTo=null, mediaUrl=null, mediaType=null, curType="all", allData=[];
function toast(m){let t=document.getElementById('toast');t.innerText=m;t.style.display='block';setTimeout(()=>t.style.display='none',2500)}
function setType(t,el){curType=t;document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));el.classList.add('active');load()}
function setReply(id,name){replyTo=id;let b=document.getElementById('replyInfo');b.style.display='block';b.innerHTML=`Replying to <b>${name}</b> <a href="#" onclick="cancelReply();return false" style="float:right">✕ Cancel</a>`;document.getElementById('t').focus()}
function cancelReply(){replyTo=null;document.getElementById('replyInfo').style.display='none'}
let upTimer=null;async function uploadFile(input){
 let file=input.files[0]; if(!file) return;
 if(file.size>8e6){toast("File too large, keep <8MB");return}
 document.getElementById('s').innerText="Encoding "+file.type+"...";
 let r=new FileReader(); r.onload=()=>{mediaUrl=r.result; mediaType=file.type.startsWith('image')?'image':file.type.startsWith('video')?'video':'audio';
  document.getElementById('mediaPreview').style.display='block';
  if(mediaType==='image') document.getElementById('mediaPreview').innerHTML=`<img src="${mediaUrl}" class="media" style="max-height:240px"><br><a href="#" onclick="clearMedia()">Remove media</a>`;
  else if(mediaType==='video') document.getElementById('mediaPreview').innerHTML=`<video src="${mediaUrl}" controls class="media" style="max-height:240px"></video><br><a href="#" onclick="clearMedia()">Remove</a>`;
  else document.getElementById('mediaPreview').innerHTML=`<audio src="${mediaUrl}" controls class="audio"></audio><br><a href="#" onclick="clearMedia()">Remove</a>`;
  document.getElementById('s').innerText="Ready! "+Math.round(mediaUrl.length/1024)+"KB • Will post with your message";
 }; r.readAsDataURL(file);
}
function clearMedia(){mediaUrl=null;mediaType=null;document.getElementById('mediaPreview').style.display='none';document.getElementById('mediaPreview').innerHTML=""}
async function getMessages(){let r=await fetch(API);let txt=await r.text();try{return JSON.parse(txt)||[]}catch{return[]}}
async function saveMessages(m){await fetch(API,{method:"POST",body:JSON.stringify(m)})}
function esc(s){return (s||"").replace(/</g,'&lt;')}
function highlight(text,q){if(!q) return esc(text);try{return esc(text).replace(new RegExp('('+q+')','gi'),'<mark>$1</mark>')}catch{return esc(text)}}
let debounce=null;function debounceLoad(){clearTimeout(debounce);debounce=setTimeout(load,300)}
async function load(first=false){
 if(first) allData=await getMessages();
 let q=document.getElementById('q').value.toLowerCase(); let sort=document.getElementById('sort').value;
 let data=[...allData]; data.sort((a,b)=> sort==='new'? b.time-a.time : a.time-b.time);
 document.getElementById('c-all').innerText=data.length; document.getElementById('c-text').innerText=data.filter(m=>!m.mediaType).length; document.getElementById('c-image').innerText=data.filter(m=>m.mediaType).length; document.getElementById('count').innerText=data.length;
 let filtered=data; if(curType==='text') filtered=data.filter(m=>!m.mediaType); if(curType==='image') filtered=data.filter(m=>m.mediaType); if(curType==='pinned') filtered=data.filter(m=>m.pinned); if(q) filtered=filtered.filter(m=>(m.text+m.name).toLowerCase().includes(q));
 let top=filtered.filter(m=>!m.replyTo); let html="";
 top.forEach(m=>{html+=render(m,q); let replies=filtered.filter(x=>x.replyTo===m.id).sort((a,b)=>a.time-b.time); if(replies.length){html+=`<div class="replyThread">`; replies.forEach(r=> html+=render(r,q,true)); html+=`</div>`}});
 document.getElementById('feed').innerHTML=html||`<div class=card style="text-align:center;color:var(--muted)">No posts found. Be the first to break the ice! 🚀</div>`;
}
function render(m,q,isReply){
 let media=""; if(m.mediaUrl){ if(m.mediaType==="image") media=`<img src="${m.mediaUrl}" class="media" loading="lazy" onclick="window.open(this.src)">`; if(m.mediaType==="video") media=`<video src="${m.mediaUrl}" controls class="media"></video>`; if(m.mediaType==="audio") media=`<audio src="${m.mediaUrl}" controls class="audio"></audio>`; }
 let pin=m.pinned?`📌 PINNED • `:""; return `<div class="msg ${m.pinned?'pinned':''}"><div class=meta><div class=avatar>${esc(m.name).charAt(0).toUpperCase()}</div><div><b>${esc(m.name)}</b> <small style="color:var(--muted)">• ${new Date(m.time).toLocaleString()} ${m.replyTo?'• reply':''}</small><div style="font-size:11px;color:var(--muted)">${pin}${isReply?'Thread reply':'Independent post'}</div></div><div style="margin-left:auto"><button class="btn-sm" onclick="togglePin('${m.id}')">📌</button></div></div><div style="margin:8px 0;white-space:pre-wrap;line-height:1.5">${highlight(m.text,q)}</div>${media}<div class=actions><button class="btn-sm" onclick="setReply('${m.id}','${esc(m.name)}')">↩ Fast Reply</button><button class="btn-sm" onclick="navigator.clipboard.writeText('${esc(m.text).slice(0,80)}');toast('Copied!')">⎙ Copy</button></div></div>`;
}
async function togglePin(id){ let msgs=await getMessages(); let m=msgs.find(x=>x.id===id); if(m){m.pinned=!m.pinned; await saveMessages(msgs); allData=msgs; load(); toast(m.pinned?'Pinned to top!':'Unpinned')}}
async function post(){
 let name=document.getElementById('n').value.trim()||"Anon"; let text=document.getElementById('t').value.trim();
 if(!text && !mediaUrl){toast("Add text or attach media");return}
 let btn=document.getElementById('postBtn'); btn.disabled=true; btn.innerText="Posting...";
 try{ let msgs=await getMessages(); msgs.unshift({id:Date.now().toString(), name, text, replyTo, mediaUrl, mediaType, pinned:false, time:Date.now()}); if(msgs.length>300) msgs=msgs.slice(0,300); await saveMessages(msgs); allData=msgs; document.getElementById('t').value=""; clearMedia(); cancelReply(); toast("Posted live! ✅"); load(); }catch(e){toast("Failed, retry")} btn.disabled=false; btn.innerText="Post • ↵";
}
document.getElementById('t').addEventListener('keydown',e=>{ if(e.key==='Enter' && !e.shiftKey){ e.preventDefault(); post(); }});
let dz=document.getElementById('dropZone'); dz.addEventListener('dragover',e=>{e.preventDefault(); dz.classList.add('drag')}); dz.addEventListener('dragleave',()=>dz.classList.remove('drag')); dz.addEventListener('drop',e=>{e.preventDefault(); dz.classList.remove('drag'); let f=e.dataTransfer.files[0]; if(f){ let i={files:[f]}; uploadFile(i)}});
load(true); setInterval(async()=>{ if(document.activeElement.id!=='t' && document.activeElement.id!=='q'){ allData=await getMessages(); load(); } },7000);
</script></body></html>
