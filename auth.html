<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FOSNALIC &mdash; Authentication Portal</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="/auth-global.js" defer></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0A0E1A; color: #F3F4F6; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 16px; }
        .auth-container { background-color: #111827; padding: 30px; border-radius: 16px; width: 100%; max-width: 400px; border: 1px solid #374151; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        h2 { text-align: center; margin-bottom: 20px; color: #FF6B35; font-size: 1.5rem; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 6px; font-size: 0.85rem; color: #9CA3AF; }
        input { width: 100%; padding: 12px; background-color: #1F2937; border: 1px solid #374151; border-radius: 8px; color: #fff; font-size: 1rem; outline: none; }
        input:focus { border-color: #FF6B35; }
        button { width: 100%; padding: 12px; background-color: #2563EB; border: none; border-radius: 8px; color: white; font-weight: bold; font-size: 1rem; cursor: pointer; margin-top: 10px; }
        button:hover { opacity: 0.9; }
        .switch-text { text-align: center; margin-top: 15px; font-size: 0.85rem; color: #9CA3AF; }
        .switch-text span { color: #FF6B35; cursor: pointer; font-weight: bold; }
        .hidden { display: none; }
        .message { text-align: center; margin-top: 12px; font-size: 0.85rem; }
        .error { color: #EF4444; }
        .success { color: #10B981; }
    </style>
</head>
<body>

    <div class="auth-container">
        <!-- LOGIN SECTION (Default) -->
        <div id="login-section">
            <h2>Portal Login</h2>
            <div class="form-group">
                <label>Email</label>
                <input type="email" id="login-email" autocomplete="email" placeholder="Enter your email">
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="login-pass" autocomplete="current-password" placeholder="Enter your password">
            </div>
            <button type="button" onclick="handleLogin()">Login</button>
            <p id="login-msg" class="message"></p>
            <div class="switch-text">
                Don't have an account? <span onclick="toggleView('register')">Register here</span>
            </div>
        </div>

        <!-- REGISTRATION SECTION -->
        <div id="register-section" class="hidden">
            <h2>Create Account</h2>
            <div class="form-group">
                <label>Full Name</label>
                <input type="text" id="reg-name" autocomplete="name" placeholder="Enter your name">
            </div>
            <div class="form-group">
                <label>Email</label>
                <input type="email" id="reg-email" autocomplete="email" placeholder="Enter your email">
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="reg-pass" autocomplete="new-password" placeholder="Create a password (min 6 chars)">
            </div>
            <button type="button" onclick="handleRegister()">Register</button>
            <p id="reg-msg" class="message"></p>
            <div class="switch-text">
                Already have an account? <span onclick="toggleView('login')">Login here</span>
            </div>
        </div>
    </div>

    <script>
        function toggleView(view) {
            const regSection = document.getElementById('register-section');
            const loginSection = document.getElementById('login-section');
            if (view === 'login') {
                regSection.classList.add('hidden');
                loginSection.classList.remove('hidden');
            } else {
                loginSection.classList.add('hidden');
                regSection.classList.remove('hidden');
            }
        }

        function getAuthClient() {
            if (window.supabaseClient) return window.supabaseClient;
            if (window.supabase) {
                window.supabaseClient = window.supabase.createClient(
                    "https://lqqbvzttjstchkjfajwj.supabase.co",
                    "sb_publishable_OD5wXFcYixFPoaQuRXcMoA_DIBcjRM7",
                    { auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true, storageKey: "sb-lqqbvzttjstchkjfajwj-auth-token", storage: window.localStorage } }
                );
                return window.supabaseClient;
            }
            return null;
        }

        window.addEventListener('DOMContentLoaded', async () => {
            const client = getAuthClient();
            if (!client) return;
            const { data } = await client.auth.getSession();
            if (data?.session?.user) {
                const name = data.session.user.user_metadata?.full_name || data.session.user.email.split('@')[0];
                localStorage.setItem('activeUser', name);
                window.location.href = 'dashboard.html';
            }
            document.getElementById('login-pass').addEventListener('keydown', (e) => { if (e.key === 'Enter') handleLogin(); });
            document.getElementById('reg-pass').addEventListener('keydown', (e) => { if (e.key === 'Enter') handleRegister(); });
        });

        async function handleRegister() {
            const name = document.getElementById('reg-name').value.trim();
            const email = document.getElementById('reg-email').value.trim();
            const pass = document.getElementById('reg-pass').value;
            const msg = document.getElementById('reg-msg');

            if (!name || !email || !pass) {
                msg.className = 'message error';
                msg.textContent = 'Please fill in all fields.';
                return;
            }
            if (pass.length < 6) {
                msg.className = 'message error';
                msg.textContent = 'Password must be at least 6 characters.';
                return;
            }

            const client = getAuthClient();
            if (!client) {
                msg.className = 'message error';
                msg.textContent = 'Auth service still loading. Please retry.';
                return;
            }

            msg.className = 'message';
            msg.textContent = 'Creating account...';

            const { data, error } = await client.auth.signUp({
                email,
                password: pass,
                options: { data: { full_name: name } }
            });

            if (error) {
                msg.className = 'message error';
                msg.textContent = error.message;
                return;
            }

            if (data.session) {
                localStorage.setItem('activeUser', name);
                msg.className = 'message success';
                msg.textContent = 'Account created! Redirecting to dashboard...';
                setTimeout(() => { window.location.href = 'dashboard.html'; }, 800);
            } else {
                msg.className = 'message success';
                msg.textContent = 'Account created! Check your email to verify, then log in.';
                setTimeout(() => {
                    toggleView('login');
                    document.getElementById('login-email').value = email;
                }, 1500);
            }
        }

        async function handleLogin() {
            const email = document.getElementById('login-email').value.trim();
            const pass = document.getElementById('login-pass').value;
            const msg = document.getElementById('login-msg');

            if (!email || !pass) {
                msg.className = 'message error';
                msg.textContent = 'Please enter email and password.';
                return;
            }

            const client = getAuthClient();
            if (!client) {
                msg.className = 'message error';
                msg.textContent = 'Auth service still loading. Please retry.';
                return;
            }

            msg.className = 'message';
            msg.textContent = 'Signing in...';

            const { data, error } = await client.auth.signInWithPassword({ email, password: pass });

            if (error) {
                msg.className = 'message error';
                msg.textContent = error.message;
                return;
            }

            const displayName = data.user?.user_metadata?.full_name || email.split('@')[0];
            localStorage.setItem('activeUser', displayName);
            msg.className = 'message success';
            msg.textContent = 'Login successful! Redirecting...';
            setTimeout(() => { window.location.href = 'dashboard.html'; }, 700);
        }
    </script>
</body>
</html>
