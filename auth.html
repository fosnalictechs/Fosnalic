<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MathX Pro / Fosnalic Techs Portal - Auth</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { background-color: #121212; color: #ffffff; display: flex; justify-content: center; align-items: center; height: 100vh; }
        .auth-container { background-color: #1e1e1e; padding: 30px; border-radius: 12px; width: 100%; max-width: 400px; box-shadow: 0 4px 20px rgba(0,0,0,0.5); }
        h2 { text-align: center; margin-bottom: 20px; color: #bb86fc; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-size: 14px; color: #b0b0b0; }
        input { width: 100%; padding: 12px; background-color: #2d2d2d; border: 1px solid #444; border-radius: 6px; color: #fff; font-size: 16px; }
        input:focus { outline: none; border-color: #bb86fc; }
        button { width: 100%; padding: 12px; background-color: #bb86fc; border: none; border-radius: 6px; color: #121212; font-weight: bold; font-size: 16px; cursor: pointer; margin-top: 10px; }
        button:hover { background-color: #9965f4; }
        .switch-text { text-align: center; margin-top: 15px; font-size: 14px; color: #b0b0b0; }
        .switch-text span { color: #bb86fc; cursor: pointer; font-weight: bold; }
        .hidden { display: none; }
        .message { text-align: center; margin-top: 10px; font-size: 14px; }
        .error { color: #cf6679; }
        .success { color: #03dac6; }
    </style>
</head>
<body>

    <div class="auth-container">
        <!-- REGISTRATION FORM -->
        <div id="register-section">
            <h2>Create Account</h2>
            <div class="form-group">
                <label>Username or Email</label>
                <input type="text" id="reg-user" placeholder="Enter username/email">
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="reg-pass" placeholder="Enter password">
            </div>
            <button onclick="handleRegister()">Register</button>
            <p id="reg-msg" class="message"></p>
            <div class="switch-text">
                Already have an account? <span onclick="toggleView('login')">Login here</span>
            </div>
        </div>

        <!-- LOGIN FORM -->
        <div id="login-section" class="hidden">
            <h2>Welcome Back</h2>
            <div class="form-group">
                <label>Username or Email</label>
                <input type="text" id="login-user" placeholder="Enter username/email">
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="login-pass" placeholder="Enter password">
            </div>
            <button onclick="handleLogin()">Login</button>
            <p id="login-msg" class="message"></p>
            <div class="switch-text">
                Don't have an account? <span onclick="toggleView('register')">Register here</span>
            </div>
        </div>
    </div>

    <script>
        function toggleView(view) {
            const regSection = document.getElementById('register-section');
            const loginSection = document.getElementById('login-section');
            if (view === 'login') {
                regSection.classList.add('hidden');
                loginSection.classList.remove('hidden');
            } else {
                loginSection.classList.add('hidden');
                regSection.classList.remove('hidden');
            }
        }

        function handleRegister() {
            const user = document.getElementById('reg-user').value.trim();
            const pass = document.getElementById('reg-pass').value.trim();
            const msg = document.getElementById('reg-msg');

            if (!user || !pass) {
                msg.className = 'message error';
                msg.textContent = 'Please fill in all fields.';
                return;
            }

            // Check if user already exists
            if (localStorage.getItem('user_' + user)) {
                msg.className = 'message error';
                msg.textContent = 'User already exists. Please login.';
                return;
            }

            // Save user data securely in localStorage
            localStorage.setItem('user_' + user, pass);
            msg.className = 'message success';
            msg.textContent = 'Registration successful! You can now login.';
            
            setTimeout(() => {
                toggleView('login');
                msg.textContent = '';
            }, 1500);
        }

        function handleLogin() {
            const user = document.getElementById('login-user').value.trim();
            const pass = document.getElementById('login-pass').value.trim();
            const msg = document.getElementById('login-msg');

            if (!user || !pass) {
                msg.className = 'message error';
                msg.textContent = 'Please fill in all fields.';
                return;
            }

            const storedPass = localStorage.getItem('user_' + user);

            if (storedPass && storedPass === pass) {
                msg.className = 'message success';
                msg.textContent = 'Login successful! Redirecting...';
                
                // Save active session
                localStorage.setItem('activeUser', user);

                setTimeout(() => {
                    // Redirect to your app dashboard or portal page
                    alert('Welcome to MathX Pro Dashboard, ' + user + '!');
                    // window.location.href = "dashboard.html"; 
                }, 1000);
            } else {
                msg.className = 'message error';
                msg.textContent = 'Invalid username or password.';
            }
        }
    </script>
</body>
</html>
