<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MathX Pro &mdash; Authentication Portal</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0A0E1A; color: #F3F4F6; display: flex; justify-content: center; align-items: center; height: 100vh; }
        .auth-container { background-color: #111827; padding: 30px; border-radius: 16px; width: 100%; max-width: 400px; border: 1px solid #374151; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        h2 { text-align: center; margin-bottom: 20px; color: #FF6B35; font-size: 1.5rem; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 6px; font-size: 0.85rem; color: #9CA3AF; }
        input { width: 100%; padding: 12px; background-color: #1F2937; border: 1px solid #374151; border-radius: 8px; color: #fff; font-size: 1rem; outline: none; }
        input:focus { border-color: #FF6B35; }
        button { width: 100%; padding: 12px; background-color: #2563EB; border: none; border-radius: 8px; color: white; font-weight: bold; font-size: 1rem; cursor: pointer; margin-top: 10px; }
        button:hover { opacity: 0.9; }
        .switch-text { text-align: center; margin-top: 15px; font-size: 0.85rem; color: #9CA3AF; }
        .switch-text span { color: #FF6B35; cursor: pointer; font-weight: bold; }
        .hidden { display: none; }
        .message { text-align: center; margin-top: 12px; font-size: 0.85rem; }
        .error { color: #EF4444; }
        .success { color: #10B981; }
    </style>
</head>
<body>

    <div class="auth-container">
        <!-- REGISTRATION SECTION -->
        <div id="register-section">
            <h2>Create Account</h2>
            <div class="form-group">
                <label>Username</label>
                <input type="text" id="reg-user" placeholder="Enter your username">
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="reg-pass" placeholder="Enter your password">
            </div>
            <button onclick="handleRegister()">Register</button>
            <p id="reg-msg" class="message"></p>
            <div class="switch-text">
                Already have an account? <span onclick="toggleView('login')">Login here</span>
            </div>
        </div>

        <!-- LOGIN SECTION -->
        <div id="login-section" class="hidden">
            <h2>Portal Login</h2>
            <div class="form-group">
                <label>Username</label>
                <input type="text" id="login-user" placeholder="Enter your username">
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="login-pass" placeholder="Enter your password">
            </div>
            <button onclick="handleLogin()">Login</button>
            <p id="login-msg" class="message"></p>
            <div class="switch-text">
                Don't have an account? <span onclick="toggleView('register')">Register here</span>
            </div>
        </div>
    </div>

    <script>
        function toggleView(view) {
            const regSection = document.getElementById('register-section');
            const loginSection = document.getElementById('login-section');
            if (view === 'login') {
                regSection.classList.add('hidden');
                loginSection.classList.remove('hidden');
            } else {
                loginSection.classList.add('hidden');
                regSection.classList.remove('hidden');
            }
        }

        function handleRegister() {
            const user = document.getElementById('reg-user').value.trim();
            const pass = document.getElementById('reg-pass').value.trim();
            const msg = document.getElementById('reg-msg');

            if (!user || !pass) {
                msg.className = 'message error';
                msg.textContent = 'Please fill in all fields.';
                return;
            }

            if (localStorage.getItem('fos_user_' + user)) {
                msg.className = 'message error';
                msg.textContent = 'User already exists. Please login.';
                return;
            }

            // Save user credentials
            localStorage.setItem('fos_user_' + user, pass);
            msg.className = 'message success';
            msg.textContent = 'Registration successful! Switching to login...';
            
            setTimeout(() => {
                toggleView('login');
                document.getElementById('login-user').value = user;
                msg.textContent = '';
            }, 1200);
        }

        function handleLogin() {
            const user = document.getElementById('login-user').value.trim();
            const pass = document.getElementById('login-pass').value.trim();
            const msg = document.getElementById('login-msg');

            if (!user || !pass) {
                msg.className = 'message error';
                msg.textContent = 'Please fill in all fields.';
                return;
            }

            const storedPass = localStorage.getItem('fos_user_' + user);

            if (storedPass && storedPass === pass) {
                msg.className = 'message success';
                msg.textContent = 'Login successful! Redirecting...';
                
                // Set active session
                localStorage.setItem('activeUser', user);

                setTimeout(() => {
                    window.location.href = 'dashboard.html';
                }, 1000);
            } else {
                msg.className = 'message error';
                msg.textContent = 'Invalid username or password.';
            }
        }
    </script>
</body>
</html>
