<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Products — FOSNALIC Techs</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Buy laptops, chargers, software at FOSNALIC Techs Kampala">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
:root{--primary:#2A4B7C;--secondary:#FF6B35;--dark:#0a0e1a;--gray:#F5F7FA;--border:#E2E8F0;--shadow:0 10px 30px rgba(0,0,0,0.08)}
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',sans-serif}
body{background:var(--gray);color:#2D3748}
.container{width:90%;max-width:1100px;margin:0 auto}
header{position:fixed;top:0;width:100%;background:white;z-index:1000;padding:14px 0;box-shadow:0 2px 10px rgba(0,0,0,.06);height:64px;display:flex;align-items:center}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:20px;margin-top:24px}
.card{background:white;border-radius:16px;overflow:hidden;box-shadow:var(--shadow);border:1px solid var(--border)}
.card img{width:100%;height:200px;object-fit:cover}
.card-body{padding:16px}
.btn{padding:10px 18px;background:linear-gradient(135deg,var(--primary),var(--secondary));color:white;border-radius:50px;text-decoration:none;font-weight:700;display:inline-flex;gap:6px;align-items:center;border:none;cursor:pointer}
.badge{background:#EEF2FF;color:#2A4B7C;padding:4px 10px;border-radius:20px;font-size:.7rem;font-weight:800}
/* TOP AD - POPUP 8S + FAST */
.fos-ad-wrap{position:fixed;top:0;left:0;width:100%;z-index:9999;background:#0a0e1a;color:white;height:44px;display:none;align-items:center;justify-content:space-between;padding:0 12px;box-shadow:0 4px 12px rgba(0,0,0,.3);animation:slideDown .5s ease}
@keyframes slideDown{from{transform:translateY(-100%)}to{transform:translateY(0)}}
.fos-ticker{flex:1;overflow:hidden;white-space:nowrap}
.fos-ticker-track{display:inline-block;white-space:nowrap;animation:tickerFast 20s linear infinite}
@keyframes tickerFast{0%{transform:translateX(0)}100%{transform:translateX(-50%)}}
.fos-home-btn{background:#FF6B35;color:white;border:none;padding:6px 14px;border-radius:20px;font-weight:800;font-size:12px;text-decoration:none;margin-left:10px;display:flex;align-items:center;gap:5px}
.powered-badge{position:fixed;bottom:12px;right:12px;background:white;border:1px solid var(--border);padding:6px 12px;border-radius:20px;font-size:11px;box-shadow:var(--shadow);z-index:999}
@media(max-width:768px){body{padding-bottom:60px}.grid{grid-template-columns:1fr 1fr;gap:12px}.card img{height:150px}}
</style>
<!-- GOOGLE ORGANIZATION SCHEMA -->
<script type="application/ld+json">
{"@context":"https://schema.org","@type":"Organization","name":"FOSNALIC Techs","url":"https://fosnalic.pages.dev","logo":"https://fosnalic.pages.dev/logo.png","sameAs":["https://fosnalic.pages.dev"]}
</script>
</head>
<body>
<!-- TOP AD -->
<div class="fos-ad-wrap" id="fosAd">
  <div class="fos-ticker"><div class="fos-ticker-track" id="fosTickerTrack"></div></div>
  <a href="home.html" class="fos-home-btn"><i class="fas fa-home"></i> Home</a>
  <button onclick="closeAd()" style="background:none;border:none;color:#A0AEC0;margin-left:10px;font-size:18px;cursor:pointer">✕</button>
</div>

<header><div class="container" style="display:flex;justify-content:space-between;align-items:center">
  <a href="index.html" style="font-weight:900;color:#2A4B7C;text-decoration:none;font-size:1.2rem">FOSNALIC Techs</a>
  <div style="display:flex;gap:16px">
    <a href="home.html" style="text-decoration:none;color:#2D3748;font-weight:700">Home</a>
    <a href="products.html" style="color:#2A4B7C;font-weight:800">Products</a>
    <a href="academy.html" style="text-decoration:none;color:#2D3748;font-weight:700">Academy</a>
  </div>
</div></header>

<section style="padding:100px 0 20px">
<div class="container">
  <h1 style="color:#1A365D"><i class="fas fa-box" style="color:#FF6B35"></i> Our Products</h1>
  <p style="color:#718096;margin:8px 0 20px">All products and Services are available for you.</p>
  <div class="grid" id="productGrid">Loading products...</div>
</div>
</section>

<div class="powered-badge">Powered by <a href="index.html" style="color:#2A4B7C;font-weight:800;text-decoration:none">FOSNALIC Techs</a></div>

<footer style="background:#0a0e1a;color:#A0AEC0;padding:30px 0;text-align:center;margin-top:40px">© <span id="year"></span> FOSNALIC Techs — <a href="https://fosnalic.pages.dev" style="color:#FF6B35">fosnalic.pages.dev</a></footer>

<script>
document.getElementById('year').textContent=new Date().getFullYear();
let GIST_ID=localStorage.getItem('fos_gist_id')||"0f719dd44c5c9bce109b0bce767f9162";

// AD POPUP AFTER 8S
setTimeout(()=>{
  document.getElementById('fosAd').style.display='flex';
},8000);
function closeAd(){document.getElementById('fosAd').style.display='none'}

async function loadProducts(){
  try{
    let r=await fetch(`https://api.github.com/gists/${GIST_ID}?t=${Date.now()}`,{cache:"no-store"});
    let j=await r.json();
    let data=JSON.parse(j.files['fosnalic-data.json'].content);
    let products=data.products||data.items||data.store||[];
    let ticker=data.ticker||["New Products Available","Call: 0741 632 492","FOSNALIC Techs Kampala"];
    
    // Ticker
    let tHtml=ticker.map(x=>`<span style="margin-right:60px">🔥 ${x}</span>`).join('');
    document.getElementById('fosTickerTrack').innerHTML=tHtml+tHtml;

    // Products Grid
    if(products.length==0){document.getElementById('productGrid').innerHTML="<p>No products in admin yet.</p>";return}
    
    let gridHtml="";
    let itemListElements=[];
    
    products.forEach((p,i)=>{
      let id=p.id||p.sku||`FOS${i}`;
      let title=p.title||p.name||"Product";
      let price=String(p.price||"").replace(/[^0-9]/g,'');
      let img=p.image||p.img||"https://images.unsplash.com/photo-1583394838336-acd977736f90?w=800";
      let desc=p.description||p.desc||title;
      let brand=p.brand||"FOSNALIC";
      
      gridHtml+=`
      <div class="card">
        <img src="${img}" alt="${title}" loading="lazy">
        <div class="card-body">
          <span class="badge">${brand} • In Stock</span>
          <h3 style="margin:8px 0;font-size:1rem">${title}</h3>
          <p style="color:#718096;font-size:.85rem;height:36px;overflow:hidden">${desc.substring(0,80)}...</p>
          <div style="display:flex;justify-content:space-between;align-items:center;margin-top:12px">
            <b style="color:#2A4B7C">UGX ${price}</b>
            <a href="https://wa.me/256740495806?text=Hi FOSNALIC, I want ${encodeURIComponent(title)}" class="btn"><i class="fab fa-whatsapp"></i> Order</a>
          </div>
        </div>
      </div>`;

      // Create Product Schema for each
      let schema={
        "@context":"https://schema.org/",
        "@type":"Product",
        "name":title,
        "image":[img],
        "description":desc,
        "sku":id,
        "brand":{"@type":"Brand","name":brand},
        "offers":{
          "@type":"Offer",
          "url":`https://fosnalic.pages.dev/products.html#${id}`,
          "priceCurrency":"UGX",
          "price":price,
          "availability":"https://schema.org/InStock",
          "itemCondition":"https://schema.org/NewCondition"
        }
      };
      if(price && parseInt(price)>0){
        let s=document.createElement('script');
        s.type='application/ld+json';
        s.text=JSON.stringify(schema);
        document.head.appendChild(s);
        itemListElements.push({"@type":"ListItem","position":i+1,"url":`https://fosnalic.pages.dev/products.html#${id}`});
      }
    });
    
    document.getElementById('productGrid').innerHTML=gridHtml;
    
    // ItemList Schema
    let listSchema={"@context":"https://schema.org","@type":"ItemList","itemListElement":itemListElements};
    let ls=document.createElement('script');
    ls.type='application/ld+json';
    ls.text=JSON.stringify(listSchema);
    document.head.appendChild(ls);

  }catch(e){
    document.getElementById('productGrid').innerHTML="<p>Failed to load products. Check Gist ID.</p>";
  }
}
loadProducts();
</script>
</body>
</html>
