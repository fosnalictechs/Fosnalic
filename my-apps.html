<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>My Apps — FOSNALIC Techs</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Download official apps by FOSNALIC Techs — Android, Business tools, School systems">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
:root{--primary:#2A4B7C;--secondary:#FF6B35;--dark:#0a0e1a;--gray:#F5F7FA;--text:#2D3748;--border:#E2E8F0;--shadow:0 10px 30px rgba(0,0,0,0.08)}
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',sans-serif}
body{background:var(--gray);color:var(--text)}
.container{width:90%;max-width:1100px;margin:0 auto}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:20px;margin-top:24px}
.card{background:white;padding:22px;border-radius:16px;box-shadow:var(--shadow);border:1px solid var(--border);transition:.2s}
.card:hover{transform:translateY(-4px)}
.btn{padding:10px 18px;background:linear-gradient(135deg,var(--primary),var(--secondary));color:white;border-radius:50px;text-decoration:none;display:inline-flex;align-items:center;gap:8px;font-weight:600;font-size:0.9rem}
.btn-sm{padding:6px 14px;font-size:.8rem}
.hero{background:linear-gradient(135deg,rgba(10,14,26,0.9),rgba(42,75,124,0.88)),url('https://images.unsplash.com/photo-1512941937669-90a1b58e7e9c?w=2000') center/cover;color:white;text-align:center;padding:90px 0 60px}
.icon-box{width:56px;height:56px;border-radius:16px;display:flex;align-items:center;justify-content:center;color:white;overflow:hidden;flex-shrink:0;border:1px solid #E2E8F0;background:#F8FAFC}
.icon-box img{width:100%;height:100%;object-fit:cover}
.icon-box i{font-size:22px}
</style>
</head>
<body>
<div style="background:white;padding:14px;box-shadow:0 2px 10px rgba(0,0,0,.05);position:fixed;top:0;width:100%;z-index:1000"><div class="container" style="display:flex;justify-content:space-between"><a href="index.html" style="text-decoration:none;font-weight:800;color:#2A4B7C">FOSNALIC Techs</a><a href="index.html" style="text-decoration:none;color:#2A4B7C;font-weight:700">Home</a></div></div>
<section class="hero"><div class="container"><h2 style="font-size:2.2rem;font-weight:800">My Apps — Download Center</h2><p style="color:#cbd5e0;margin-top:8px">Choose version by Date - Latest first • Works for all apps</p></div></section>
<div class="container" style="padding:40px 20px"><div id="apps" class="grid"></div></div>
<script>
let GIST_ID=localStorage.getItem('fos_gist_id')||"0f719dd44c5c9bce109b0bce767f9162";
async function loadApps(){
 let r=await fetch(`https://api.github.com/gists/${GIST_ID}?t=${Date.now()}`,{cache:"no-store"});
 let j=await r.json();let data=JSON.parse(j.files['fosnalic-data.json'].content);let apps=data.apps||[];
 if(!apps.length){document.getElementById('apps').innerHTML='<div style="text-align:center;padding:60px;background:white;border-radius:16px">No Apps Available Yet</div>';return;}
 document.getElementById('apps').innerHTML=apps.map(app=>{
   let vers=(app.versions||[]).slice().sort((a,b)=> new Date(b.date)-new Date(a.date));
   let latest=vers[0]; if(!latest) return '';
   // UNIVERSAL ICON - works for ALL apps
   let iconContent = app.iconUrl 
     ? `<img src="${app.iconUrl}" alt="${app.name}" onerror="this.parentElement.innerHTML='<i class=\\'fas ${app.icon||'fa-mobile-alt'}\\' style=\\'color:#2A4B7C\\'></i>'">`
     : `<i class="fas ${app.icon||'fa-mobile-alt'}" style="color:#2A4B7C"></i>`;
   
   let iconBoxStyle = app.iconUrl ? `style="padding:0"` : `style="background:linear-gradient(135deg,#EEF2FF,#FFE5D9)"`;

   // UNIVERSAL description fallback
   let desc = app.desc || `This is the new version of ${app.name}, built with advanced features to suit the user.`;

   return `<div class="card">
   <div style="display:flex;gap:14px;align-items:center"><div class="icon-box" ${iconBoxStyle}>${iconContent}</div><div><h3>${app.name}</h3><p style="color:#A0AEC0;font-size:.8rem">${latest.ver} • ${latest.date} • ${latest.size}</p></div></div>
   <p style="color:#718096;font-size:.9rem;margin:14px 0">${desc}<br><small style="color:#2A4B7C">${latest.notes||''}</small></p>
   <a href="${latest.file}" class="btn" download><i class="fas fa-download"></i> Download ${latest.ver} (Latest)</a>
   ${vers.length>1?`<details style="margin-top:14px;background:#F8FAFC;padding:10px;border-radius:10px"><summary style="cursor:pointer;color:#2A4B7C;font-weight:700">Older versions (${vers.length-1}) - Sorted by Date</summary><div style="margin-top:10px">${vers.map(v=>`<div style="display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #EDF2F7;gap:10px"><div><b>${v.ver}</b> <span style="background:#E2E8F0;padding:2px 8px;border-radius:20px;font-size:.75rem">${v.date}</span> ${v.size}<br><small style="color:#718096">${v.notes||''}</small></div><a href="${v.file}" class="btn btn-sm" download>Download</a></div>`).join('')}</div></details>`:''}
   </div>`;
 }).join('');
}
loadApps();
</script>
</body>
</html>
