<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>My Apps — FOSNALIC Techs</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
:root{--primary:#2A4B7C;--secondary:#FF6B35;--gray:#F5F7FA;--border:#E2E8F0;--shadow:0 10px 30px rgba(0,0,0,0.08)}
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',sans-serif}
body{background:var(--gray)}
.container{width:90%;max-width:1100px;margin:0 auto}
.card{background:white;padding:18px;border-radius:16px;box-shadow:var(--shadow);border:1px solid var(--border);cursor:pointer;transition:.2s}
.card:hover{transform:translateY(-3px)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:18px;margin-top:20px}
.btn{padding:10px 18px;background:linear-gradient(135deg,var(--primary),var(--secondary));color:white;border-radius:50px;text-decoration:none;display:inline-flex;align-items:center;gap:8px;font-weight:700;font-size:.9rem;border:none;cursor:pointer}
.btn-sm{padding:6px 14px;font-size:.8rem}
.hero{background:linear-gradient(135deg,rgba(10,14,26,0.92),rgba(42,75,124,0.9)),url('https://images.unsplash.com/photo-1512941937669-90a1b58e7e9c?w=2000') center/cover;color:white;text-align:center;padding:90px 0 50px}
.icon-box{width:56px;height:56px;border-radius:16px;display:flex;align-items:center;justify-content:center;overflow:hidden;flex-shrink:0;border:1px solid #E2E8F0;background:#F8FAFC}
.icon-box img{width:100%;height:100%;object-fit:cover}
.hidden{display:none}
.topbar{background:white;padding:14px;box-shadow:0 2px 10px rgba(0,0,0,.05);position:fixed;top:0;width:100%;z-index:1000}
.version-row{display:flex;justify-content:space-between;align-items:center;padding:12px;border:1px solid #F1F5F9;border-radius:12px;margin:8px 0;background:#FAFBFC}
.badge{background:#E0F2FF;color:#1A365D;padding:3px 10px;border-radius:20px;font-size:.7rem;font-weight:700}
</style>
</head>
<body>
<div class="topbar"><div class="container" style="display:flex;justify-content:space-between"><a href="index.html" style="text-decoration:none;font-weight:800;color:#2A4B7C">FOSNALIC Techs</a><a href="#" onclick="showList()" id="backBtn" class="hidden" style="text-decoration:none;color:#2A4B7C;font-weight:700"><i class="fas fa-arrow-left"></i> Back to Apps</a><a href="index.html" id="homeBtn" style="text-decoration:none;color:#2A4B7C;font-weight:700">Home</a></div></div>

<section class="hero" id="hero"><div class="container"><h2 id="heroTitle" style="font-size:2.2rem;font-weight:800">My Apps — Download Center</h2><p id="heroSub" style="color:#cbd5e0;margin-top:8px">Tap any app to see its versions</p></div></section>

<div class="container" style="padding:30px 20px">
<!-- SECTION 1: LIST OF ALL APPS -->
<div id="section-apps"><div id="appsList" class="grid"></div></div>

<!-- SECTION 2: ONE APP DETAIL - ALL ITS VERSIONS -->
<div id="section-detail" class="hidden">
  <div id="detailHeader" class="card" style="margin-bottom:18px"></div>
  <h3 style="color:#1A365D;margin:12px 0"><i class="fas fa-layer-group"></i> All Versions - Latest First</h3>
  <div id="detailVersions"></div>
</div>
</div>

<script>
let GIST_ID=localStorage.getItem('fos_gist_id')||"0f719dd44c5c9bce109b0bce767f9162";
let ALL_APPS=[];

async function loadApps(){
 let r=await fetch(`https://api.github.com/gists/${GIST_ID}?t=${Date.now()}`,{cache:"no-store"});
 let j=await r.json();let data=JSON.parse(j.files['fosnalic-data.json'].content);
 ALL_APPS=data.apps||[];
 if(!ALL_APPS.length){document.getElementById('appsList').innerHTML='<div style="text-align:center;padding:60px;background:white;border-radius:16px">No Apps Yet</div>';return;}
 
 document.getElementById('appsList').innerHTML=ALL_APPS.map((app,idx)=>{
   let vers=(app.versions||[]).slice().sort((a,b)=> new Date(b.date)-new Date(a.date));
   let latest=vers[0];
   let icon = app.iconUrl ? `<img src="${app.iconUrl}">` : `<i class="fas ${app.icon||'fa-mobile-alt'}" style="color:#2A4B7C"></i>`;
   let desc = app.desc || `This is the new version of ${app.name}, built with advanced features to suit the user.`;
   return `<div class="card" onclick="openApp(${idx})">
     <div style="display:flex;gap:14px;align-items:center"><div class="icon-box">${icon}</div><div><h3>${app.name}</h3><p style="color:#A0AEC0;font-size:.8rem">${latest?latest.ver+' • '+latest.date:''} • ${vers.length} version(s)</p></div></div>
     <p style="color:#718096;font-size:.85rem;margin:12px 0;height:40px;overflow:hidden">${desc.substring(0,90)}...</p>
     <div style="display:flex;justify-content:space-between;align-items:center"><span class="badge"><i class="fas fa-download"></i> ${vers.length} versions</span><span style="color:#2A4B7C;font-weight:700;font-size:.85rem">Open <i class="fas fa-chevron-right"></i></span></div>
   </div>`;
 }).join('');
}

function openApp(idx){
 let app=ALL_APPS[idx];
 let vers=(app.versions||[]).slice().sort((a,b)=> new Date(b.date)-new Date(a.date));
 let latest=vers[0];
 let icon = app.iconUrl ? `<img src="${app.iconUrl}">` : `<i class="fas ${app.icon||'fa-mobile-alt'}" style="color:#2A4B7C;font-size:28px"></i>`;
 
 // Hide list, show detail
 document.getElementById('section-apps').classList.add('hidden');
 document.getElementById('section-detail').classList.remove('hidden');
 document.getElementById('backBtn').classList.remove('hidden');
 document.getElementById('homeBtn').classList.add('hidden');
 document.getElementById('heroTitle').textContent=app.name;
 document.getElementById('heroSub').textContent=`${vers.length} versions available • Tap install on any version`;

 document.getElementById('detailHeader').innerHTML=`
   <div style="display:flex;gap:16px;align-items:center"><div class="icon-box" style="width:72px;height:72px">${icon}</div>
   <div style="flex:1"><h2 style="color:#1A365D">${app.name}</h2><p style="color:#718096;font-size:.9rem;margin:6px 0">${app.desc || `This is the new version of ${app.name}, built with advanced features to suit the user.`}</p><p style="font-size:.8rem"><span class="badge" style="background:#DCFCE7;color:#166534">Latest: ${latest?latest.ver:''}</span> <span style="color:#94A3B8">${latest?latest.date+' • '+latest.size:''}</span></p></div></div>
   ${latest?`<div style="margin-top:16px"><a href="${latest.file}" class="btn" style="width:100%;justify-content:center" download><i class="fas fa-download"></i> Install Latest ${latest.ver} (${latest.size})</a></div>`:''}
 `;

 document.getElementById('detailVersions').innerHTML=vers.map((v,i)=>{
   let isLatest=i===0;
   return `<div class="version-row" style="${isLatest?'border:2px solid #2A4B7C;background:#F0F9FF':''}">
     <div style="flex:1"><div style="display:flex;gap:8px;align-items:center"><b>${v.ver}</b> ${isLatest?'<span class="badge" style="background:#1A365D;color:white">LATEST</span>':''} <span class="badge">${v.date}</span> <small style="color:#64748B">${v.size}</small></div>
     <small style="color:#475569;display:block;margin-top:4px">${v.notes||`This is the new version of ${app.name}, built with advanced features`}</small>
     <small style="color:#94A3B8;word-break:break-all;font-size:.7rem">${v.file.substring(0,50)}...</small></div>
     <div style="display:flex;flex-direction:column;gap:6px"><a href="${v.file}" class="btn btn-sm" download><i class="fas fa-download"></i> Install</a></div>
   </div>`;
 }).join('');

 window.scrollTo(0,0);
}

function showList(){
 document.getElementById('section-apps').classList.remove('hidden');
 document.getElementById('section-detail').classList.add('hidden');
 document.getElementById('backBtn').classList.add('hidden');
 document.getElementById('homeBtn').classList.remove('hidden');
 document.getElementById('heroTitle').textContent='My Apps — Download Center';
 document.getElementById('heroSub').textContent='Tap any app to see its versions';
}

loadApps();
</script>
</body>
</html>
