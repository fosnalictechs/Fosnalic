<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>All Files - FOSNALIC Techs</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>*{margin:0;padding:0;box-sizing:border-box;font-family:Segoe UI}body{background:#0a0e1a;color:#fff;padding:20px}.container{max-width:1000px;margin:0 auto}.card{background:#111827;border:1px solid #1F2937;border-radius:14px;padding:14px;margin:8px 0;display:flex;justify-content:space-between;align-items:center}.card:hover{background:#1F2937}a{color:#FF6B35;text-decoration:none;font-weight:700}.btn{padding:8px 16px;background:#1A365D;color:#fff;border-radius:20px;display:inline-block}</style></head><body>
<div class="container"><h1><i class="fas fa-folder-tree"></i> FOSNALIC Files - Live from GitHub</h1><p style="color:#94A3B8;margin:10px 0">This page auto-lists every file you add in GitHub / Admin - shows instantly on fosnalic.pages.dev</p><a href="index.html" class="btn"><i class="fas fa-home"></i> Home</a><div id="list" style="margin-top:20px">Loading files from GitHub...</div></div>
<script>
let owner='fosnalictechs',repo='fosnalic',branch='main';
async function load(){
 let r=await fetch(`https://api.github.com/repos/${owner}/${repo}/contents?ref=${branch}&t=${Date.now()}`);
 let files=await r.json();
 document.getElementById('list').innerHTML=files.map(f=>{
   let icon=f.name.endsWith('.html')?'📄':f.name.endsWith('.css')?'🎨':f.name.endsWith('.js')?'⚙️':'📁';
   let url=f.type==='dir'?`https://github.com/${owner}/${repo}/tree/${branch}/${f.path}`:`https://${repo.split('/')[0]}.pages.dev/${f.path}`; // pages.dev direct
   if(f.type!=='dir') url=`./${f.name}`;
   return `<div class="card"><span>${icon} <b>${f.name}</b> <small style="color:#64748B">${f.type} - ${(f.size/1024).toFixed(1)} KB</small></span><div><a href="${url}" target="_blank">Open <i class="fas fa-external-link-alt"></i></a> <a href="${f.download_url}" style="margin-left:10px;color:#22c55e">Raw</a></div></div>`;
 }).join('');
}
load();
</script></body></html>
