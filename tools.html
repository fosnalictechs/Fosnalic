<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>FOS Tools — Free Online Tools by FOSNALIC</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',sans-serif}
body{background:#0a0e1a;color:white}
.container{max-width:1100px;margin:0 auto;padding:20px}
header{background:white;padding:12px 20px;position:sticky;top:0;z-index:10}
header h1{color:#1a365d;font-size:1.2rem}
h2{font-size:1.8rem;margin:20px 0 10px}
.tool-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:20px;margin-top:20px}
.tool-card{background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.12);border-radius:18px;padding:22px}
.tool-card h3{color:#FF6B35;margin-bottom:12px}
input,textarea{width:100%;padding:12px;border-radius:10px;border:1px solid #333;background:#111827;color:white;margin:8px 0}
button{padding:10px 18px;border-radius:20px;border:none;background:linear-gradient(135deg,#2A4B7C,#FF6B35);color:white;font-weight:700;cursor:pointer;margin-top:8px}
#qrcode{margin-top:12px;background:white;padding:10px;border-radius:10px;width:fit-content}
.result{margin-top:10px;padding:10px;background:#111827;border-radius:10px;font-size:13px;word-break:break-all}
</style>
</head>
<body>
<header><div class="container"><h1><a href="index.html" style="color:#1a365d;text-decoration:none">← FOSNALIC Techs</a> — FOS Tools</h1></div></header>
<div class="container">
<h2>Free Tools For You</h2>
<p style="color:#94A3B8">Fast, free, no signup. Made for Uganda & Africa.</p>

<div class="tool-grid">

<!-- 1. QR Generator -->
<div class="tool-card">
<h3><i class="fas fa-qrcode"></i> QR Generator</h3>
<input id="qrText" placeholder="Enter link or text... e.g https://fosnalic.pages.dev">
<button onclick="genQR()">Generate QR</button>
<div id="qrcode"></div>
</div>

<!-- 2. URL Shortener (depot) -->
<div class="tool-card">
<h3><i class="fas fa-link"></i> URL Shortener</h3>
<input id="longUrl" placeholder="Paste long URL">
<button onclick="shortUrl()">Shorten & Save</button>
<div id="shortResult" class="result"></div>
</div>

<!-- 3. Image Compressor -->
<div class="tool-card">
<h3><i class="fas fa-compress"></i> Image Compressor</h3>
<input type="file" id="imgFile" accept="image/*">
<button onclick="compressImg()">Compress to 60%</button>
<div id="imgResult" class="result"></div>
<a id="downloadImg" style="display:none"><button>Download</button></a>
</div>

<!-- 4. Password Generator -->
<div class="tool-card">
<h3><i class="fas fa-key"></i> Strong Password</h3>
<input id="passLen" type="number" value="16" min="8" max="32">
<button onclick="genPass()">Generate</button>
<div id="passResult" class="result" style="font-family:monospace"></div>
</div>

<!-- 5. Text Tools -->
<div class="tool-card">
<h3><i class="fas fa-font"></i> Text Case Converter</h3>
<textarea id="txtArea" rows="4" placeholder="Paste text..."></textarea>
<button onclick="txtUpper()">UPPERCASE</button>
<button onclick="txtLower()" style="background:#111827;border:1px solid #333">lowercase</button>
</div>

<!-- 6. WhatsApp Link -->
<div class="tool-card">
<h3><i class="fab fa-whatsapp"></i> WhatsApp Link Generator</h3>
<input id="waNumber" placeholder="Number e.g 2567XXXXXXXX">
<textarea id="waMsg" rows="2" placeholder="Message"></textarea>
<button onclick="genWA()">Generate WA Link</button>
<div id="waResult" class="result"></div>
</div>

</div>
</div>

<script>
function genQR(){
 let v=document.getElementById('qrText').value.trim(); if(!v) return;
 document.getElementById('qrcode').innerHTML='';
 new QRCode(document.getElementById('qrcode'), {text:v, width:180, height:180});
}

async function shortUrl(){
 let url=document.getElementById('longUrl').value.trim(); if(!url) return;
 let key='FOS'+Math.random().toString(36).substring(2,6).toUpperCase();
 // Save to depot for all devices
 try{
  await fetch('/api/storage?key=fos-links',{
   method:'POST', headers:{'Content-Type':'application/json'},
   body: JSON.stringify({action:'add', key:key, url:url})
  });
 }catch(e){}
 document.getElementById('shortResult').innerHTML=`Short: <b>fosnalic.pages.dev/l/${key}</b><br>Original: ${url}<br><small>Saved to all devices via depot</small>`;
}

function genPass(){
 let len=parseInt(document.getElementById('passLen').value)||16;
 let chars='ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnpqrstuvwxyz23456789!@#$%';
 let p=''; for(let i=0;i<len;i++) p+=chars[Math.floor(Math.random()*chars.length)];
 document.getElementById('passResult').innerText=p;
}

let compressedBlob=null;
function compressImg(){
 let file=document.getElementById('imgFile').files[0]; if(!file) return;
 let img=new Image(); img.src=URL.createObjectURL(file);
 img.onload=()=>{
  let c=document.createElement('canvas'); let max=800;
  let scale=Math.min(max/img.width, max/img.height, 1);
  c.width=img.width*scale; c.height=img.height*scale;
  c.getContext('2d').drawImage(img,0,0,c.width,c.height);
  c.toBlob(b=>{compressedBlob=b; 
   document.getElementById('imgResult').innerText=`Original: ${(file.size/1024).toFixed(1)}KB → Compressed: ${(b.size/1024).toFixed(1)}KB`;
   let url=URL.createObjectURL(b); let a=document.getElementById('downloadImg'); a.href=url; a.download='fos-compressed.jpg'; a.style.display='block';
  },'image/jpeg',0.6);
 }
}

function txtUpper(){ let a=document.getElementById('txtArea'); a.value=a.value.toUpperCase(); }
function txtLower(){ let a=document.getElementById('txtArea'); a.value=a.value.toLowerCase(); }

function genWA(){
 let n=document.getElementById('waNumber').value.replace(/[^0-9]/g,''); let m=encodeURIComponent(document.getElementById('waMsg').value);
 let link=`https://wa.me/${n}?text=${m}`;
 document.getElementById('waResult').innerHTML=`<a href="${link}" target="_blank" style="color:#22c55e">${link}</a>`;
}
</script>
</body>
</html>
