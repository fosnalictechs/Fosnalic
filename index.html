<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>All Files - FOSNALIC Techs</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>*{margin:0;padding:0;box-sizing:border-box;font-family:Segoe UI}body{background:#0a0e1a;color:#fff;padding:20px}.container{max-width:1000px;margin:0 auto}.card{background:#111827;border:1px solid #1F2937;border-radius:14px;padding:14px;margin:8px 0;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px}.card:hover{background:#1F2937}a{color:#FF6B35;text-decoration:none;font-weight:700}.btn{padding:8px 16px;background:#1A365D;color:#fff;border-radius:20px;display:inline-block;margin:5px 5px 5px 0}.btn-green{background:#16a34a} .btn-orange{background:#FF6B35} input{width:100%;padding:10px;border-radius:8px;background:#1F2937;border:1px solid #334155;color:#fff;margin-top:10px}</style></head><body>
<div class="container">
<h1><i class="fas fa-folder-tree"></i> FOSNALIC Files - Live from GitHub</h1>
<p style="color:#94A3B8;margin:10px 0">This page auto-lists every file you add - shows instantly<br>For developer use only</p>

<a href="index.html" class="btn"><i class="fas fa-home"></i> Home</a>
<button onclick="downloadFullZip()" class="btn btn-orange"><i class="fas fa-file-archive"></i> Download Full Site as ZIP</button>
<button onclick="document.getElementById('tokenBox').style.display='block'" class="btn btn-green"><i class="fas fa-key"></i> Private ZIP (with token)</button>

<div id="tokenBox" style="display:none">
<input type="password" id="token" placeholder="Paste ghp_... token for private repo download">
<button onclick="downloadPrivateZip()" class="btn btn-green" style="width:100%;margin-top:8px">Download Private ZIP via API</button>
<div id="status" style="color:#94A3B8;font-size:13px;margin-top:8px">Idle</div>
</div>

<div id="list" style="margin-top:20px">Loading files from GitHub...</div>
</div>

<script>
let owner='fosnalictechs',repo='fosnalic',branch='main';

async function load(){
 try{
  let r=await fetch(`https://api.github.com/repos/${owner}/${repo}/contents?ref=${branch}&t=${Date.now()}`);
  if(!r.ok) throw new Error('GitHub API '+r.status);
  let files=await r.json();
  if(!Array.isArray(files)) throw new Error(files.message||'Empty repo');
  
  document.getElementById('list').innerHTML=files.map(f=>{
    let icon=f.name.endsWith('.html')?'📄':f.name.endsWith('.css')?'🎨':f.name.endsWith('.js')?'⚙️':'📁';
    let openUrl=f.type==='dir'?`https://github.com/${owner}/${repo}/tree/${branch}/${f.path}`:`./${f.name}`;
    return `<div class="card"><span>${icon} <b>${f.name}</b> <small style="color:#64748B">${f.type} - ${f.size? (f.size/1024).toFixed(1)+' KB':''}</small></span><div><a href="${openUrl}" target="_blank">Open <i class="fas fa-external-link-alt"></i></a> <a href="${f.download_url||'#'}" target="_blank" style="margin-left:10px;color:#22c55e">Raw</a></div></div>`;
  }).join('');
 }catch(e){
  document.getElementById('list').innerHTML=`<div style="color:#f87171">Failed: ${e.message}<br>Repo maybe private - add token.</div>`;
 }
}

// This works 100% for public repo - no fetch, no CORS, just direct link
function downloadFullZip(){
  // Works even if branch is master or main
  window.location.href = `https://github.com/${owner}/${repo}/archive/refs/heads/${branch}.zip`;
}

// This uses your token + /dl function (you need functions/dl.js from previous step)
async function downloadPrivateZip(){
  const token=document.getElementById('token').value.trim();
  const status=document.getElementById('status');
  if(!token) return alert('Paste token');
  status.textContent='Downloading via proxy...';
  try{
    const res=await fetch(`/dl?owner=${owner}&repo=${repo}&branch=${branch}`,{
      headers:{'Authorization':'Bearer '+token}
    });
    if(!res.ok) throw new Error(await res.text());
    const blob=await res.blob();
    const a=document.createElement('a');
    a.href=URL.createObjectURL(blob);
    a.download=`${repo}.zip`;
    a.click();
    status.textContent='Downloaded!';
  }catch(err){
    status.textContent='Failed: '+err.message+' - If you dont have functions/dl.js deployed, use the orange public button.';
  }
}

load();
</script>
<script defer src='https://static.cloudflareinsights.com/beacon.min.js' data-cf-beacon='{"token": "f4043667174c4bcf8ce18fb577700342"}'></script>
</body></html>
