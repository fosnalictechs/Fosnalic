<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fosnalic - Downloader</title>
<style>body{background:#111;color:#fff;font-family:sans-serif;padding:15px}input,button{width:100%;padding:12px;border-radius:8px;border:0;margin-top:8px;box-sizing:border-box}input{background:#222;color:#fff}button{background:#238636;color:#fff;font-weight:bold} .repo{background:#1c1c1c;border:1px solid #333;padding:12px;border-radius:10px;margin-top:10px} .top{display:flex;justify-content:space-between;align-items:center} .dl{background:#1f6feb;color:#fff;padding:8px 14px;border-radius:6px;margin-top:8px} #s{color:#aaa;margin-top:8px;font-size:13px} pre{white-space:pre-wrap;background:#000;padding:8px;border-radius:8px;color:#888;font-size:11px;max-height:100px;overflow:auto}</style>
</head>
<body>
<h3 style="margin:0">fosnalictechs downloader</h3>
<input type="password" id="t" placeholder="Paste ghp_ token">
<button onclick="load()">Show My Websites</button>
<div id="s">Idle</div>
<pre id="log"></pre>
<div id="list"></div>

<script>
let TOK='';
const $ = id=>document.getElementById(id);
function log(m){ $('log').textContent+=m+"\n"; }

async function load(){
 TOK=$('t').value.trim();
 $('log').textContent='';
 $('list').innerHTML='';
 if(!TOK) return alert('Paste token');
 $('s').textContent='Loading...';

 try{
  let r = await fetch('https://api.github.com/user/repos?per_page=100&sort=updated', {
   headers:{'Authorization':'Bearer '+TOK, 'Accept':'application/vnd.github+json'}
  });
  if(!r.ok) throw new Error(await r.text());
  let repos = await r.json();
  $('s').textContent=`Found ${repos.length} repos - tap Download`;

  $('list').innerHTML = repos.map(x=>`
    <div class="repo">
      <div class="top"><b>${x.name}</b><small style="color:#666">${x.private?'private':'public'} • ${x.default_branch}</small></div>
      <div style="color:#888;font-size:12px;margin-top:4px">${x.description||''}</div>
      <button class="dl" onclick="downloadZip('${x.owner.login}','${x.name}','${x.default_branch}')">Download ${x.name}.zip</button>
    </div>
  `).join('');
 }catch(e){ $('s').textContent='Failed'; log(e.message); }
}

async function downloadZip(owner, repo, branch){
 $('s').textContent=`Downloading ${repo} (${branch})...`;
 log(`Downloading ${owner}/${repo}/${branch}`);
 try{
  let url = `https://api.github.com/repos/${owner}/${repo}/zipball/${branch}`;
  let res = await fetch(url, {headers:{'Authorization':'Bearer '+TOK, 'Accept':'application/vnd.github+json'}});
  if(!res.ok){
    let txt = await res.text();
    log(`zipball/${branch} failed: ${res.status} ${txt.slice(0,300)}`);
    // fallback try without branch
    url = `https://api.github.com/repos/${owner}/${repo}/zipball`;
    res = await fetch(url, {headers:{'Authorization':'Bearer '+TOK}});
  }
  if(!res.ok) throw new Error(await res.text());
  let blob = await res.blob();
  let a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `${repo}.zip`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  $('s').textContent=`${repo}.zip downloaded!`;
 }catch(e){
  $('s').textContent='Download failed';
  log('ERROR: '+e.message);
  log(`Try manually: https://github.com/${owner}/${repo}`);
 }
}
</script>
</body>
</html>
