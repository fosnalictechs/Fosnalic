<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fosnalic Downloader</title>
<style>body{background:#111;color:#fff;font-family:sans-serif;padding:15px}input,button{width:100%;padding:12px;border-radius:8px;border:0;margin-top:8px;box-sizing:border-box}input{background:#222;color:#fff}button{background:#238636;color:#fff;font-weight:bold} .repo{background:#1c1c1c;border:1px solid #333;padding:10px;border-radius:8px;margin-top:10px;display:flex;justify-content:space-between;align-items:center} pre{white-space:pre-wrap;background:#000;padding:10px;border-radius:8px;color:#f88;font-size:12px}</style>
</head>
<body>
<h3>fosnalic.pages.dev downloader</h3>
<input type="password" id="t" placeholder="Paste ghp_ or github_pat_ token">
<button onclick="test()">TEST TOKEN & LOAD</button>
<div id="s" style="margin-top:10px;color:#aaa">Idle</div>
<pre id="log"></pre>
<div id="list"></div>

<script>
let TOK='';
const log = (m)=>{ document.getElementById('log').textContent += m+"\n"; console.log(m); }

async function test(){
 TOK=document.getElementById('t').value.trim();
 const s=document.getElementById('s');
 document.getElementById('log').textContent='';
 if(!TOK) return alert('Paste token');

 s.textContent='Testing token...';
 try{
   // Step 1 - test auth
   let r = await fetch('https://api.github.com/user', {
     headers:{'Authorization':'Bearer '+TOK, 'Accept':'application/vnd.github+json'}
   });
   log(`GET /user -> ${r.status}`);
   let txt = await r.text();
   log(txt.slice(0,500));
   if(!r.ok) throw new Error('Auth failed - check token. GitHub says: '+txt);

   let user = JSON.parse(txt);
   s.textContent=`OK as ${user.login} - loading repos...`;

   // Step 2 - load repos
   let r2 = await fetch('https://api.github.com/user/repos?per_page=100&sort=updated', {
     headers:{'Authorization':'Bearer '+TOK, 'Accept':'application/vnd.github+json'}
   });
   log(`GET /user/repos -> ${r2.status}`);
   let txt2 = await r2.text();
   if(!r2.ok) throw new Error('Repos fetch failed: '+txt2);
   let repos = JSON.parse(txt2);

   s.textContent=`Found ${repos.length} repos`;
   document.getElementById('list').innerHTML = repos.map(x=>`
     <div class=repo><div><b>${x.name}</b></div><button onclick="dl('${x.owner.login}','${x.name}')" style="background:#1f6feb;color:#fff;border:0;padding:8px 12px;border-radius:6px">Download ZIP</button></div>
   `).join('');

 }catch(e){
   s.textContent='FAILED';
   log('ERROR: '+e.message);
   log('Fix: If you use github_pat_... fine-grained token, you MUST select your repos in token settings, or create a Classic token with repo scope.');
 }
}

async function dl(o,r){
 const s=document.getElementById('s');
 s.textContent='Downloading '+r+'...';
 try{
  let res=await fetch(`https://api.github.com/repos/${o}/${r}/zipball`, {headers:{'Authorization':'Bearer '+TOK, 'Accept':'application/vnd.github+json'}});
  if(!res.ok) throw new Error(await res.text());
  let blob=await res.blob();
  let a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=r+'.zip'; a.click();
  s.textContent=r+' downloaded';
 }catch(e){ log('DL ERROR: '+e.message); }
}
</script>
</body>
</html>
