<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Sites - One Tap Download</title>
<style>
 body{font-family:sans-serif;background:#0f0f0f;color:#fff;margin:0;padding:20px}
 #top{position:sticky;top:0;background:#0f0f0f;padding:10px 0 15px;border-bottom:1px solid #222}
 input{width:100%;padding:12px;border-radius:8px;border:none;background:#222;color:#fff;box-sizing:border-box}
 button{padding:10px 14px;border:none;border-radius:8px;cursor:pointer}
 #loadBtn{background:#238636;color:#fff;width:100%;margin-top:10px;font-weight:bold}
 .repo{background:#1a1a1a;border:1px solid #333;padding:12px;border-radius:10px;margin:10px 0;display:flex;justify-content:space-between;align-items:center}
 .repo b{font-size:15px}
 .repo small{color:#888;display:block;margin-top:3px}
 .dl{background:#1f6feb;color:#fff}
 #status{color:#aaa;font-size:13px;margin-top:8px}
</style>
</head>
<body>

<div id="top">
  <h3 style="margin:0 0 10px">My GitHub Sites</h3>
  <input id="token" placeholder="Paste GitHub PAT here (ghp_...)">
  <button id="loadBtn" onclick="loadRepos()">Show My Websites</button>
  <div id="status">Idle</div>
</div>

<div id="list"></div>

<script>
let _token = '';

async function loadRepos(){
  _token = document.getElementById('token').value.trim();
  const status = document.getElementById('status');
  const list = document.getElementById('list');
  
  if(!_token){ alert('Paste your API key'); return; }
  
  status.textContent = 'Loading your repos...';
  list.innerHTML = '';

  try{
    let page = 1;
    let allRepos = [];
    while(true){
      const res = await fetch(`https://api.github.com/user/repos?per_page=100&page=${page}&sort=updated`, {
        headers:{'Authorization':`token ${_token}`}
      });
      if(!res.ok) throw new Error(await res.text());
      const data = await res.json();
      if(data.length===0) break;
      allRepos = allRepos.concat(data);
      page++;
      if(page>5) break; // limit to 500 repos for speed
    }

    if(allRepos.length===0){
      status.textContent = 'No repos found';
      return;
    }

    status.textContent = `Found ${allRepos.length} repos. Tap Download.`;
    
    list.innerHTML = allRepos.map(r => `
      <div class="repo">
        <div>
          <b>${r.name}</b>
          <small>${r.private?'Private':'Public'} • ${r.updated_at.split('T')[0]} • ${r.description||''}</small>
        </div>
        <button class="dl" onclick="downloadRepo('${r.owner.login}','${r.name}')">Download</button>
      </div>
    `).join('');

  }catch(e){
    status.textContent = 'Error: ' + e.message;
    console.error(e);
  }
}

async function downloadRepo(owner, repo){
  const status = document.getElementById('status');
  status.textContent = `Downloading ${repo}.zip...`;
  try{
    const res = await fetch(`https://api.github.com/repos/${owner}/${repo}/zipball`, {
      headers:{'Authorization':`token ${_token}`}
    });
    if(!res.ok) throw new Error(await res.text());
    const blob = await res.blob();
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `${repo}.zip`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    status.textContent = `${repo}.zip downloaded!`;
  }catch(e){
    status.textContent = 'Download failed: ' + e.message;
  }
}
</script>
</body>
</html>
